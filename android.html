<title>Northlight for Android</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* ===== styles/01-m3-tokens.css ===== */
/* ============================================================
   MATERIAL 3 — tonal palettes and colour roles
   Source colour: the Northlight brand teal (#0B7285), expanded
   into the M3 tonal system. Light is defined on bare :root; dark
   is redefined under prefers-color-scheme and again under an
   explicit [data-theme] stamp so the toggle wins both ways.
   ============================================================ */
:root{
  /* ---- tonal palettes ---- */
  --p0:#000000;  --p10:#001F26; --p20:#00363F; --p30:#004E5A; --p40:#006876;
  --p50:#008394; --p60:#22A0B2; --p70:#4EBCCE; --p80:#6FD8EB; --p90:#A7EDFF;
  --p95:#D6F5FF; --p99:#F7FDFF; --p100:#FFFFFF;

  --s10:#051F24; --s20:#1C3439; --s30:#334B50; --s40:#4A6268; --s50:#627B81;
  --s60:#7B959B; --s70:#96B0B6; --s80:#B1CBD2; --s90:#CDE7EE; --s95:#DBF5FD;

  --t10:#111C34; --t20:#26314A; --t30:#3C4862; --t40:#54607B; --t50:#6C7895;
  --t60:#8692B0; --t70:#A0ADCB; --t80:#BCC8E7; --t90:#DBE4FF; --t95:#EEF1FF;

  --n6:#0E1415;  --n10:#191C1D; --n20:#2D3132; --n30:#444748; --n40:#5C5F60;
  --n50:#757778; --n60:#8F9192; --n70:#A9ACAD; --n80:#C5C7C8; --n90:#E0E3E4;
  --n95:#EFF1F2; --n98:#F5FAFB; --n99:#FAFDFD;

  --nv30:#3F484B; --nv50:#6F797B; --nv60:#899295; --nv80:#BFC8CB; --nv90:#DBE4E7;

  --e10:#410002; --e20:#690005; --e30:#93000A; --e40:#BA1A1A;
  --e80:#FFB4AB; --e90:#FFDAD6;

  /* ---- light scheme roles ---- */
  --md-primary:var(--p40);              --md-on-primary:var(--p100);
  --md-primary-container:var(--p90);    --md-on-primary-container:var(--p10);
  --md-secondary:var(--s40);            --md-on-secondary:#FFFFFF;
  --md-secondary-container:var(--s90);  --md-on-secondary-container:var(--s10);
  --md-tertiary:var(--t40);             --md-on-tertiary:#FFFFFF;
  --md-tertiary-container:var(--t90);   --md-on-tertiary-container:var(--t10);
  --md-error:var(--e40);                --md-on-error:#FFFFFF;
  --md-error-container:var(--e90);      --md-on-error-container:var(--e10);

  --md-surface:var(--n98);              --md-on-surface:var(--n10);
  --md-surface-variant:var(--nv90);     --md-on-surface-variant:var(--nv30);
  --md-surface-dim:#D8DEDF;             --md-surface-bright:var(--n99);
  --md-container-lowest:#FFFFFF;        --md-container-low:#EFF5F6;
  --md-container:#E9F0F1;               --md-container-high:#E3EAEB;
  --md-container-highest:#DEE4E5;

  --md-outline:var(--nv50);             --md-outline-variant:var(--nv80);
  --md-inverse-surface:var(--n20);      --md-inverse-on-surface:var(--n95);
  --md-inverse-primary:var(--p80);
  --md-scrim:rgba(0,0,0,.4);
  --md-shadow:rgba(0,0,0,1);

  /* ---- semantic: rental order statuses, mapped onto M3 containers ---- */
  --st-concept-bg:var(--md-container-high); --st-concept-fg:var(--nv30);
  --st-reserved-bg:#DDE1FF;                 --st-reserved-fg:#001551;
  --st-started-bg:#FFDDB3;                  --st-started-fg:#2A1700;
  --st-stopped-bg:#A9F0BE;                  --st-stopped-fg:#00210E;
  --st-mixed-bg:#EFDBFF;                    --st-mixed-fg:#280056;
  --st-archived-bg:var(--md-container);     --st-archived-fg:var(--nv50);
  --st-canceled-bg:var(--e90);              --st-canceled-fg:var(--e10);

  /* ---- elevation (M3 = shadow + surface tint) ---- */
  --el0:none;
  --el1:0 1px 2px rgba(0,0,0,.30), 0 1px 3px 1px rgba(0,0,0,.15);
  --el2:0 1px 2px rgba(0,0,0,.30), 0 2px 6px 2px rgba(0,0,0,.15);
  --el3:0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.30);
  --el4:0 6px 10px 4px rgba(0,0,0,.15), 0 2px 3px rgba(0,0,0,.30);
  --el5:0 8px 12px 6px rgba(0,0,0,.15), 0 4px 4px rgba(0,0,0,.30);

  /* ---- shape scale ---- */
  --sh-xs:4px; --sh-sm:8px; --sh-md:12px; --sh-lg:16px; --sh-xl:28px; --sh-full:999px;

  /* ---- type ---- */
  --font:"Roboto", "Roboto Flex", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"Roboto Mono", ui-monospace, monospace;

  /* ---- motion (M3 emphasized easing) ---- */
  --ease-emph:cubic-bezier(.2,0,0,1);
  --ease-standard:cubic-bezier(.2,0,0,1);
  --ease-decel:cubic-bezier(0,0,0,1);
  --dur-short:120ms; --dur-med:280ms; --dur-long:450ms;

  /* ---- android chrome ---- */
  --status-h:28px; --nav-h:24px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --md-primary:var(--p80);              --md-on-primary:var(--p20);
    --md-primary-container:var(--p30);    --md-on-primary-container:var(--p90);
    --md-secondary:var(--s80);            --md-on-secondary:var(--s20);
    --md-secondary-container:var(--s30);  --md-on-secondary-container:var(--s90);
    --md-tertiary:var(--t80);             --md-on-tertiary:var(--t20);
    --md-tertiary-container:var(--t30);   --md-on-tertiary-container:var(--t90);
    --md-error:var(--e80);                --md-on-error:var(--e20);
    --md-error-container:var(--e30);      --md-on-error-container:var(--e90);

    --md-surface:var(--n6);               --md-on-surface:var(--n90);
    --md-surface-variant:var(--nv30);     --md-on-surface-variant:var(--nv80);
    --md-surface-dim:var(--n6);           --md-surface-bright:#343A3B;
    --md-container-lowest:#090F10;        --md-container-low:var(--n10);
    --md-container:#1D2021;               --md-container-high:#272B2C;
    --md-container-highest:#323535;

    --md-outline:var(--nv60);             --md-outline-variant:var(--nv30);
    --md-inverse-surface:var(--n90);      --md-inverse-on-surface:var(--n20);
    --md-inverse-primary:var(--p40);
    --md-scrim:rgba(0,0,0,.6);

    --st-concept-bg:#2F3335;  --st-concept-fg:var(--nv80);
    --st-reserved-bg:#28306B; --st-reserved-fg:#DDE1FF;
    --st-started-bg:#4A3116;  --st-started-fg:#FFDDB3;
    --st-stopped-bg:#0C4A25;  --st-stopped-fg:#A9F0BE;
    --st-mixed-bg:#3D2260;    --st-mixed-fg:#EFDBFF;
    --st-archived-bg:#242829; --st-archived-fg:var(--nv60);
    --st-canceled-bg:var(--e30); --st-canceled-fg:var(--e90);
  }
}
:root[data-theme="dark"]{
  --md-primary:var(--p80);              --md-on-primary:var(--p20);
  --md-primary-container:var(--p30);    --md-on-primary-container:var(--p90);
  --md-secondary:var(--s80);            --md-on-secondary:var(--s20);
  --md-secondary-container:var(--s30);  --md-on-secondary-container:var(--s90);
  --md-tertiary:var(--t80);             --md-on-tertiary:var(--t20);
  --md-tertiary-container:var(--t30);   --md-on-tertiary-container:var(--t90);
  --md-error:var(--e80);                --md-on-error:var(--e20);
  --md-error-container:var(--e30);      --md-on-error-container:var(--e90);

  --md-surface:var(--n6);               --md-on-surface:var(--n90);
  --md-surface-variant:var(--nv30);     --md-on-surface-variant:var(--nv80);
  --md-surface-dim:var(--n6);           --md-surface-bright:#343A3B;
  --md-container-lowest:#090F10;        --md-container-low:var(--n10);
  --md-container:#1D2021;               --md-container-high:#272B2C;
  --md-container-highest:#323535;

  --md-outline:var(--nv60);             --md-outline-variant:var(--nv30);
  --md-inverse-surface:var(--n90);      --md-inverse-on-surface:var(--n20);
  --md-inverse-primary:var(--p40);
  --md-scrim:rgba(0,0,0,.6);

  --st-concept-bg:#2F3335;  --st-concept-fg:var(--nv80);
  --st-reserved-bg:#28306B; --st-reserved-fg:#DDE1FF;
  --st-started-bg:#4A3116;  --st-started-fg:#FFDDB3;
  --st-stopped-bg:#0C4A25;  --st-stopped-fg:#A9F0BE;
  --st-mixed-bg:#3D2260;    --st-mixed-fg:#EFDBFF;
  --st-archived-bg:#242829; --st-archived-fg:var(--nv60);
  --st-canceled-bg:var(--e30); --st-canceled-fg:var(--e90);
}

/* Material You: a second source colour, as Android 12+ would extract
   from the user's wallpaper. Toggled by [data-dynamic]. */
:root[data-dynamic="violet"]{
  --md-primary:#6750A4; --md-on-primary:#FFFFFF;
  --md-primary-container:#EADDFF; --md-on-primary-container:#21005D;
  --md-secondary:#625B71; --md-secondary-container:#E8DEF8; --md-on-secondary-container:#1D192B;
  --md-tertiary:#7D5260; --md-tertiary-container:#FFD8E4; --md-on-tertiary-container:#31111D;
  --md-surface:#FEF7FF; --md-on-surface:#1D1B20;
  --md-container-lowest:#FFFFFF; --md-container-low:#F7F2FA; --md-container:#F3EDF7;
  --md-container-high:#ECE6F0; --md-container-highest:#E6E0E9;
  --md-outline:#79747E; --md-outline-variant:#CAC4D0; --md-inverse-primary:#D0BCFF;
}
:root[data-dynamic="violet"][data-theme="dark"],
:root[data-dynamic="violet"]:not([data-theme="light"]) {
  /* dark Material You is applied by the same rule set below */
}
@media (prefers-color-scheme: dark){
  :root[data-dynamic="violet"]:not([data-theme="light"]){
    --md-primary:#D0BCFF; --md-on-primary:#381E72;
    --md-primary-container:#4F378B; --md-on-primary-container:#EADDFF;
    --md-secondary:#CCC2DC; --md-secondary-container:#4A4458; --md-on-secondary-container:#E8DEF8;
    --md-tertiary:#EFB8C8; --md-tertiary-container:#633B48; --md-on-tertiary-container:#FFD8E4;
    --md-surface:#141218; --md-on-surface:#E6E0E9;
    --md-container-lowest:#0F0D13; --md-container-low:#1D1B20; --md-container:#211F26;
    --md-container-high:#2B2930; --md-container-highest:#36343B;
    --md-outline:#938F99; --md-outline-variant:#49454F; --md-inverse-primary:#6750A4;
  }
}
:root[data-dynamic="violet"][data-theme="dark"]{
  --md-primary:#D0BCFF; --md-on-primary:#381E72;
  --md-primary-container:#4F378B; --md-on-primary-container:#EADDFF;
  --md-secondary:#CCC2DC; --md-secondary-container:#4A4458; --md-on-secondary-container:#E8DEF8;
  --md-tertiary:#EFB8C8; --md-tertiary-container:#633B48; --md-on-tertiary-container:#FFD8E4;
  --md-surface:#141218; --md-on-surface:#E6E0E9;
  --md-container-lowest:#0F0D13; --md-container-low:#1D1B20; --md-container:#211F26;
  --md-container-high:#2B2930; --md-container-highest:#36343B;
  --md-outline:#938F99; --md-outline-variant:#49454F; --md-inverse-primary:#6750A4;
}

/* ===== styles/02-m3-components.css ===== */
/* ============================================================
   MATERIAL 3 components — the Android widget vocabulary.
   Everything inside the device screen uses only these classes.
   ============================================================ */
.m3{
  font-family:var(--font);
  color:var(--md-on-surface);
  background:var(--md-surface);
  -webkit-font-smoothing:antialiased;
}
.m3 *,.m3 *::before,.m3 *::after{box-sizing:border-box}
.m3 button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.m3 :focus-visible{outline:3px solid var(--md-primary);outline-offset:1px;border-radius:var(--sh-xs)}

/* ---------- type scale ---------- */
.display-s{font-size:36px;line-height:44px;font-weight:400;letter-spacing:0}
.headline-l{font-size:32px;line-height:40px;font-weight:400}
.headline-m{font-size:28px;line-height:36px;font-weight:400}
.headline-s{font-size:24px;line-height:32px;font-weight:400}
.title-l{font-size:22px;line-height:28px;font-weight:400}
.title-m{font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px}
.title-s{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px}
.body-l{font-size:16px;line-height:24px;letter-spacing:.5px}
.body-m{font-size:14px;line-height:20px;letter-spacing:.25px}
.body-s{font-size:12px;line-height:16px;letter-spacing:.4px}
.label-l{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px}
.label-m{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px}
.label-s{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.5px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.on-var{color:var(--md-on-surface-variant)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- state layer (M3 ripple stand-in) ---------- */
.state{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
.state::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity var(--dur-short) var(--ease-standard);pointer-events:none}
.state:hover::after{opacity:.08}
.state:active::after{opacity:.12}

/* ---------- top app bar ---------- */
.appbar{display:flex;align-items:center;gap:4px;padding:0 4px;height:64px;background:var(--md-surface);position:sticky;top:0;z-index:20;flex:none}
.appbar.scrolled{background:var(--md-container);box-shadow:var(--el2)}
.appbar .title{font-size:22px;line-height:28px;padding:0 8px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar.large{height:auto;flex-direction:column;align-items:stretch;padding-bottom:20px}
.appbar.large .rowline{display:flex;align-items:center;gap:4px;height:64px;padding:0 4px}
.appbar.large .big{font-size:28px;line-height:36px;padding:0 16px}
.appbar.center .title{text-align:center}
.iconbtn{width:48px;height:48px;border-radius:var(--sh-full);display:grid;place-items:center;flex:none;color:var(--md-on-surface-variant)}
.iconbtn.on{color:var(--md-primary)}
.iconbtn .badge{position:absolute;top:8px;right:8px;min-width:16px;height:16px;border-radius:8px;background:var(--md-error);color:var(--md-on-error);font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px}

/* ---------- bottom nav ---------- */
.navbar{display:flex;background:var(--md-container);flex:none;padding:12px 0 16px;gap:0}
.navbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--md-on-surface-variant);padding:0}
.navbar .pill{width:64px;height:32px;border-radius:var(--sh-full);display:grid;place-items:center;transition:background var(--dur-short) var(--ease-standard);position:relative}
.navbar button.on .pill{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.navbar button.on .lbl{color:var(--md-on-surface);font-weight:700}
.navbar .lbl{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px}
.navbar .dot{position:absolute;top:2px;right:12px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--md-error);color:var(--md-on-error);font-size:10px;font-weight:700;display:grid;place-items:center}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 24px;border-radius:var(--sh-full);font-size:14px;font-weight:500;letter-spacing:.1px;white-space:nowrap}
.btn.filled{background:var(--md-primary);color:var(--md-on-primary)}
.btn.tonal{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.btn.outlined{border:1px solid var(--md-outline);color:var(--md-primary)}
.btn.text{padding:0 12px;color:var(--md-primary)}
.btn.elevated{background:var(--md-container-low);color:var(--md-primary);box-shadow:var(--el1)}
.btn.danger{background:var(--md-error);color:var(--md-on-error)}
.btn.wide{width:100%}
.btn:disabled{opacity:.38;pointer-events:none}
.btn.icon-only{width:40px;padding:0}
.btnrow{display:flex;gap:8px}

/* ---------- FAB ---------- */
.fab{position:absolute;right:16px;bottom:16px;height:56px;min-width:56px;border-radius:var(--sh-lg);background:var(--md-primary-container);color:var(--md-on-primary-container);box-shadow:var(--el3);display:flex;align-items:center;justify-content:center;gap:12px;padding:0 16px;z-index:15;font-size:14px;font-weight:500}
.fab.extended{padding:0 20px 0 16px}
.fab.small{height:40px;min-width:40px;border-radius:var(--sh-md);padding:0}

/* ---------- cards & list items ---------- */
.card{background:var(--md-container-low);border-radius:var(--sh-md);overflow:hidden}
.card.outlined{background:var(--md-surface);border:1px solid var(--md-outline-variant)}
.card.elevated{background:var(--md-container-low);box-shadow:var(--el1)}
.card.filled{background:var(--md-container-highest)}
.card-pad{padding:16px}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:16px;padding:8px 16px;min-height:56px;background:var(--md-surface);text-align:left;width:100%}
.li.two{min-height:72px}
.li.three{min-height:88px;align-items:flex-start;padding-top:12px;padding-bottom:12px}
.li .lead{width:40px;height:40px;border-radius:var(--sh-full);display:grid;place-items:center;flex:none;background:var(--md-primary-container);color:var(--md-on-primary-container);font-size:16px}
.li .lead.square{border-radius:var(--sh-sm);background:var(--md-container-high);color:var(--md-on-surface-variant)}
.li .body{flex:1;min-width:0}
.li .headline{font-size:16px;line-height:24px;color:var(--md-on-surface)}
.li .support{font-size:14px;line-height:20px;color:var(--md-on-surface-variant);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .trail{color:var(--md-on-surface-variant);font-size:11px;text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.divider{height:1px;background:var(--md-outline-variant);margin:0 16px}
.divider.full{margin:0}

/* ---------- chips ---------- */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 16px;border-radius:var(--sh-sm);border:1px solid var(--md-outline);font-size:14px;font-weight:500;color:var(--md-on-surface-variant);white-space:nowrap;flex:none;background:transparent}
.chip.on{background:var(--md-secondary-container);color:var(--md-on-secondary-container);border-color:transparent}
.chip.assist{border-color:var(--md-outline-variant)}
.chip .cnt{font-family:var(--font-mono);font-size:11px;opacity:.75}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--sh-sm);font-size:12px;font-weight:500;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.concept{background:var(--st-concept-bg);color:var(--st-concept-fg)}
.badge.reserved{background:var(--st-reserved-bg);color:var(--st-reserved-fg)}
.badge.started{background:var(--st-started-bg);color:var(--st-started-fg)}
.badge.stopped{background:var(--st-stopped-bg);color:var(--st-stopped-fg)}
.badge.mixed{background:var(--st-mixed-bg);color:var(--st-mixed-fg)}
.badge.archived{background:var(--st-archived-bg);color:var(--st-archived-fg)}
.badge.canceled{background:var(--st-canceled-bg);color:var(--st-canceled-fg)}
.badge.new{background:var(--st-concept-bg);color:var(--st-concept-fg)}
.badge.err{background:var(--md-error-container);color:var(--md-on-error-container)}
.badge.ok{background:var(--st-stopped-bg);color:var(--st-stopped-fg)}
.badge.warn{background:var(--st-started-bg);color:var(--st-started-fg)}
.badge.info{background:var(--st-reserved-bg);color:var(--st-reserved-fg)}
.badge.neutral{background:var(--md-container-high);color:var(--md-on-surface-variant)}

/* ---------- segmented button ---------- */
.segmented{display:flex;border:1px solid var(--md-outline);border-radius:var(--sh-full);overflow:hidden;height:40px}
.segmented button{flex:1;font-size:14px;font-weight:500;color:var(--md-on-surface);border-right:1px solid var(--md-outline);display:flex;align-items:center;justify-content:center;gap:6px}
.segmented button:last-child{border-right:0}
.segmented button.on{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}

/* ---------- search ---------- */
.searchbar{display:flex;align-items:center;gap:8px;height:56px;margin:8px 16px;padding:0 8px 0 16px;border-radius:var(--sh-full);background:var(--md-container-high);color:var(--md-on-surface-variant)}

    ${divider(true)}

      ${btn({ label: 'Send a payment link', kind: 'outlined', wide: true, icon: 'mail', act: 'payment.link', data: { id: o.id } })}

MobileRegistry.screen({
  id: 'reports', title: 'Reports', group: 'More', order: 460, tab: 'more',
  describe: 'Read-only on mobile. The pull sheet is the one crews actually use standing in the warehouse, so it leads.',
  render: ({ state }) => {
    const tab = state.reportTab || 'pull';
    const orders = openOrders().filter(o => sameDay(D(o.startsAt), new Date()) || sameDay(D(o.stopsAt), new Date()) || isLate(o));
    const tally = {};
    orders.forEach(o => o.lines.forEach(l => { if (l.productId) tally[l.productId] = (tally[l.productId] || 0) + l.qty; }));
    const prodStats = () => {
      const m = {};
      Data.orders().filter(o => !['canceled', 'concept'].includes(o.status)).forEach(o => o.lines.forEach(l => {
        if (!l.productId) return;
        m[l.productId] = m[l.productId] || { rev: 0, qty: 0 };
        m[l.productId].rev += lineTotal(l, o); m[l.productId].qty += l.qty;
      }));
      return Object.entries(m).map(([id, v]) => ({ p: Data.product(id), ...v })).sort((a, b) => b.rev - a.rev);
    };
    const stats = prodStats();
    const max = stats[0]?.rev || 1;

    return `
    ${appbar({ title: 'Reports', nav: 'back', actions: iconAction('share', 'reports.export', { label: 'Export' }) })}
    ${chips([{ id: 'pull', label: 'Pull sheet' }, { id: 'products', label: 'Products' }, { id: 'money', label: 'Revenue' }], tab, 'reports.tab')}
    ${scroll(tab === 'pull' ? `
      <div class="body-s on-var" style="padding:4px 16px 10px">Everything that must leave or return today. Tick as you pick.</div>
      ${Object.entries(tally).sort((a, b) => b[1] - a[1]).map(([pid, q]) => {
        const p = Data.product(pid);
        const on = orders.filter(o => o.lines.some(l => l.productId === pid));
        return listItem({
          lines: 3, lead: `<span class="checkbox"></span>`, square: true,
          headline: esc(p.name),
          support: `${esc(p.sku)} · ${on.map(o => '#' + o.number).join(', ')}`,
          trail: `<span class="headline-s mono">${q}</span>`,
          act: 'reports.tick'
        });
      }).join(divider()) || emptyState('box', 'Nothing to pull', 'No movements today.')}
    ` : tab === 'products' ? `
      ${stats.map(s => `<div style="padding:12px 16px">
        <div class="spread"><span class="body-m trunc grow">${esc(s.p.name)}</span><span class="body-m mono">${money0(s.rev)}</span></div>
        <div style="margin-top:6px">${linear((s.rev / max) * 100)}</div>
        <div class="body-s on-var" style="margin-top:4px">${s.qty} units out · ${esc(s.p.sku)}</div>
      </div>`).join('')}
    ` : `
      <div class="statrow" style="margin-bottom:12px">
        ${stat('Booked', money0(sum(Data.orders().filter(o => !['canceled', 'concept'].includes(o.status)), o => orderTotals(o).total)), 'all open + closed')}
        ${stat('Owed', money0(sum(Data.orders().filter(o => !['canceled', 'concept', 'archived'].includes(o.status)), o => Math.max(0, orderTotals(o).due))), 'outstanding')}
      </div>
      ${sectionHeader('Orders by status')}
      ${Object.keys(Lifecycle.states).map(s => {
        const n = Data.orders().filter(o => o.status === s).length;
        if (!n) return '';
        return `<div style="padding:8px 16px"><div class="spread">
          <span class="rowc" style="gap:8px">${badge(Lifecycle.label(s), Lifecycle.tone(s))}</span>
          <span class="body-m mono">${n}</span></div></div>`;
      }).join('')}
      ${sectionHeader('Where orders come from')}
      ${['Back office', 'Online store', 'Mobile POS'].map(src => {
        const n = Data.orders().filter(o => o.source === src).length;
        const pct = Math.round(n / Data.orders().length * 100);
        return `<div style="padding:8px 16px">
          <div class="spread"><span class="body-m">${src}</span><span class="body-s on-var mono">${n} · ${pct}%</span></div>
          <div style="margin-top:6px">${linear(pct)}</div></div>`;

    <div class="sp24"></div>`;
  }
});

  'profile.open': () => Nav.push('profile'),

  'customer.open': ({ data }) => Nav.push('customer', { id: data.id }),
  'customer.new': () => { Nav.dismiss(); Nav.toast('New customer form'); },

  'calendar.today': ({ state, render }) => { state.calDay = new Date().toISOString(); render(); },

  'documents.filter': ({ data, state, render }) => { state.docFilter = data.value; render(); },
  'document.open': ({ data }) => Nav.push('document', { id: data.id }),
  'document.print': () => Nav.toast('Sent to the nearest printer'),
  'document.share': () => Nav.toast('Shared via the Android share sheet'),
  'document.send': ({ data, render }) => {
    const d = Data.document(data.id);

    if (d.status === 'Draft') d.status = 'Sent';
    Store.changed('documents');
    Nav.toast(`${d.number} sent to ${d.sentTo}`); render();

      </div>
      <div class="pcard">
        <h3>Shared with the web dashboard</h3>
        <div class="kv"><span class="k">Order states</span><span class="v">${Object.keys(Registry.describe() && {}).length ? '' : ''}8 declared</span></div>
        <div class="kv"><span class="k">Availability rules</span><span class="v">${Registry.availabilityRules().length}</span></div>
        <div class="kv"><span class="k">Money steps</span><span class="v">${Registry.moneySteps().length}</span></div>
        <div class="kv"><span class="k">Entity schemas</span><span class="v">${Registry.entities().length}</span></div>
        <div class="kv"><span class="k">Settings panels</span><span class="v">${Registry.panels().length}</span></div>
        <div class="kv"><span class="k">Data source</span><span class="v"><span class="kbd">${esc(Store.adapterName())}</span></span></div>
        <div class="lede" style="margin-top:10px">Pick an order up here and the web dashboard shows it as Picked up — one store, two front ends.</div>
      </div>

}

function galleryMode() {
  const groups = MobileRegistry.byGroup();
  return `
    <div class="pcard" style="margin-bottom:20px">
      <h3>${MobileRegistry.count()} screens, every one reachable in the app</h3>
      <div class="lede">Rendered live from the same code the device runs — not mockups. Click any screen to open it on the device.</div>
    </div>
    ${groups.map(g => `
      <div class="groupbar"><h2>${esc(g.name)}</h2><span>${g.items.length} screens</span></div>
      <div class="gallery">
        ${g.items.map(s => `
          <div class="gcell" data-goto="${esc(s.id)}">
            <div class="gframe"><div class="mini m3">${deviceChrome(screenBody(s, undefined, {}), { standalone: s.standalone, tab: s.tab })}</div></div>
            <div class="gmeta">
              <div class="gt">${esc(s.title)}</div>
              <div class="gd">${esc((s.describe || '').split('.')[0])}.</div>
              <div class="gp">${esc(s.id)}</div>
            </div>
          </div>`).join('')}
      </div>`).join('')}`;
}

/* ---- events ---- */
function wire() {
  document.addEventListener('click', e => {
    const t = e.target;

    const mode = t.closest('[data-mode]');
    if (mode) { S.mode = mode.dataset.mode; return render(); }
    const dev = t.closest('[data-device]');
    if (dev) { S.device = dev.dataset.device; return render(); }
    const th = t.closest('[data-theme-set]');
    if (th) {
      const v = th.dataset.themeSet;
      if (v === 'system') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', v);
      return render();
    }
    if (t.closest('[data-dyn]')) {
      const on = document.documentElement.getAttribute('data-dynamic') === 'violet';
      if (on) document.documentElement.removeAttribute('data-dynamic');
      else document.documentElement.setAttribute('data-dynamic', 'violet');
      return render();
    }
    if (t.closest('[data-reset]')) { Nav.reset(); S.screen = {}; S.mode = 'app'; return render(); }

    const goto = t.closest('[data-goto]');
    if (goto) { S.mode = 'app'; Nav.goto(goto.dataset.goto); return; }

    if (t.closest('[data-dismiss]')) return Nav.dismiss();
    const navEl = t.closest('[data-nav]');
    if (navEl) return Nav.back();
    const tab = t.closest('.navbar [data-tab]');
    if (tab) return Nav.switchTab(tab.dataset.tab);

    const act = t.closest('[data-act]');
    if (act) {
      e.preventDefault();
      const fn = ACTIONS[act.dataset.act];
      if (!fn) return Nav.toast(`No handler for "${act.dataset.act}"`);
      fn({ data: act.dataset, state: S.screen, root: document, render, el: act });
      return;
    }
  });

  document.addEventListener('input', e => {
    const el = e.target.closest('[data-search-input]');
    if (!el) return;
    const key = el.dataset.searchInput === 'picker' ? 'pickerQuery' : 'searchQuery';
    S.screen[key] = el.value;
    const pos = el.selectionStart;
    render();
    const again = document.querySelector(`[data-search-input="${el.dataset.searchInput}"]`)
      || document.querySelector('[data-search-input]');
    if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch { /* ignore */ } }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') Nav.back();
  });

  Nav.onChange = render;
}

/* signature canvas is the one place raw DOM work is needed */
function wireSignaturePad() {
  const cv = document.querySelector('#sigpad');
  if (!cv || cv.dataset.wired) return;
  cv.dataset.wired = '1';
  const rect = cv.getBoundingClientRect();
  cv.width = rect.width * 2; cv.height = rect.height * 2;
  const ctx = cv.getContext('2d');
  ctx.scale(2, 2);
  ctx.strokeStyle = getComputedStyle(cv).color || '#000';
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  let drawing = false;
  const pt = e => {
    const r = cv.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return [p.clientX - r.left, p.clientY - r.top];
  };
  const start = e => { drawing = true; ctx.beginPath(); ctx.moveTo(...pt(e)); e.preventDefault();
    const h = document.querySelector('#sighint'); if (h) h.style.display = 'none'; };
  const move = e => { if (!drawing) return; ctx.lineTo(...pt(e)); ctx.stroke(); e.preventDefault(); };
  const end = () => { if (drawing) cv.dataset.signed = '1'; drawing = false; };
  cv.addEventListener('mousedown', start); cv.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  cv.addEventListener('touchstart', start, { passive: false });
  cv.addEventListener('touchmove', move, { passive: false });
  cv.addEventListener('touchend', end);
}

wire();
render();

globalThis.Northlight = { Nav, MobileRegistry, Store, Registry, S, FLOWS, render };

  return { screenBody, deviceChrome };
})();
})();
