<title>Booqable Operator Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ===== styles/01-tokens.css ===== */
/* ============================================================
   BOOQABLE OPERATOR CONSOLE — functional rebuild
   Tokens: light is defined on bare :root, dark redefined twice
   ============================================================ */
:root{
  --ink-900:#0B1220; --ink-800:#131E31; --ink-700:#1E2C43; --ink-600:#2B3B55;
  --ink-text:#C3D0E0; --ink-text-2:#8496AD; --ink-line:#22304A;

  --canvas:#F3F6FA; --surface:#FFFFFF; --surface-2:#F8FAFC; --surface-3:#EEF2F7;
  --line:#DEE6EF; --line-strong:#C4D0DE;
  --text:#15202E; --text-2:#4B5C71; --text-3:#7D8DA0;

  --accent:#0B7285; --accent-600:#095E6E; --accent-700:#074C59;
  --accent-tint:#E3F0F3; --accent-tint-2:#CFE5EA; --on-accent:#FFFFFF;

  --st-new:#64748B;      --st-new-bg:#EDF1F6;
  --st-concept:#5B6B80;  --st-concept-bg:#ECF0F5;
  --st-reserved:#2563EB; --st-reserved-bg:#E6EEFE;
  --st-started:#A85B06;  --st-started-bg:#FCEFD9;
  --st-stopped:#15803D;  --st-stopped-bg:#E1F4E8;
  --st-mixed:#6D28D9;    --st-mixed-bg:#EFE9FD;
  --st-archived:#8494A6; --st-archived-bg:#F0F3F7;
  --st-canceled:#B4231C; --st-canceled-bg:#FBE8E7;

  --good:#15803D; --good-bg:#E1F4E8;
  --warn:#A85B06; --warn-bg:#FCEFD9;
  --crit:#B4231C; --crit-bg:#FBE8E7;
  --info:#2563EB; --info-bg:#E6EEFE;

  --seq-1:#E3F0F3; --seq-2:#B9DBE2; --seq-3:#84BECB; --seq-4:#4A9DAF; --seq-5:#0B7285;

  --shadow-1:0 1px 2px rgba(15,32,48,.06), 0 1px 3px rgba(15,32,48,.04);
  --shadow-2:0 4px 12px rgba(15,32,48,.08), 0 1px 3px rgba(15,32,48,.05);
  --shadow-3:0 18px 48px rgba(11,24,40,.20), 0 2px 8px rgba(11,24,40,.10);

  --r-sm:5px; --r-md:8px; --r-lg:12px; --r-xl:16px;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display:"Archivo", var(--sans);
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --sidebar-w:236px; --topbar-h:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink-900:#070C15; --ink-800:#0C1421; --ink-700:#16223A; --ink-600:#22314C;
    --ink-text:#B9C7DA; --ink-text-2:#7688A0; --ink-line:#1A2740;
    --canvas:#0B121D; --surface:#121B2A; --surface-2:#0F1826; --surface-3:#1A2536;
    --line:#233145; --line-strong:#33455E;
    --text:#E4EBF4; --text-2:#A2B2C6; --text-3:#758699;
    --accent:#31A3B8; --accent-600:#48B6C9; --accent-700:#66C7D7;
    --accent-tint:#12303A; --accent-tint-2:#17414F; --on-accent:#04222A;
    --st-new:#94A3B8;      --st-new-bg:#1C2739;
    --st-concept:#98A7BA;  --st-concept-bg:#1B2536;
    --st-reserved:#7DA6FF; --st-reserved-bg:#152546;
    --st-started:#E8A03C;  --st-started-bg:#33240D;
    --st-stopped:#4ECB7B;  --st-stopped-bg:#0E2C1A;
    --st-mixed:#B292F5;    --st-mixed-bg:#231A3D;
    --st-archived:#8494A6; --st-archived-bg:#1A2434;
    --st-canceled:#F0736A; --st-canceled-bg:#331615;
    --good:#4ECB7B; --good-bg:#0E2C1A;
    --warn:#E8A03C; --warn-bg:#33240D;
    --crit:#F0736A; --crit-bg:#331615;
    --info:#7DA6FF; --info-bg:#152546;
    --seq-1:#12303A; --seq-2:#17495A; --seq-3:#1F6B81; --seq-4:#2A8DA6; --seq-5:#43B4CB;
    --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 4px 14px rgba(0,0,0,.45);
    --shadow-3:0 18px 48px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ink-900:#070C15; --ink-800:#0C1421; --ink-700:#16223A; --ink-600:#22314C;
  --ink-text:#B9C7DA; --ink-text-2:#7688A0; --ink-line:#1A2740;
  --canvas:#0B121D; --surface:#121B2A; --surface-2:#0F1826; --surface-3:#1A2536;
  --line:#233145; --line-strong:#33455E;
  --text:#E4EBF4; --text-2:#A2B2C6; --text-3:#758699;
  --accent:#31A3B8; --accent-600:#48B6C9; --accent-700:#66C7D7;
  --accent-tint:#12303A; --accent-tint-2:#17414F; --on-accent:#04222A;
  --st-new:#94A3B8;      --st-new-bg:#1C2739;
  --st-concept:#98A7BA;  --st-concept-bg:#1B2536;
  --st-reserved:#7DA6FF; --st-reserved-bg:#152546;
  --st-started:#E8A03C;  --st-started-bg:#33240D;
  --st-stopped:#4ECB7B;  --st-stopped-bg:#0E2C1A;
  --st-mixed:#B292F5;    --st-mixed-bg:#231A3D;
  --st-archived:#8494A6; --st-archived-bg:#1A2434;
  --st-canceled:#F0736A; --st-canceled-bg:#331615;
  --good:#4ECB7B; --good-bg:#0E2C1A;
  --warn:#E8A03C; --warn-bg:#33240D;
  --crit:#F0736A; --crit-bg:#331615;
  --info:#7DA6FF; --info-bg:#152546;
  --seq-1:#12303A; --seq-2:#17495A; --seq-3:#1F6B81; --seq-4:#2A8DA6; --seq-5:#43B4CB;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 4px 14px rgba(0,0,0,.45);
  --shadow-3:0 18px 48px rgba(0,0,0,.6);
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.012em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
.dim{color:var(--text-3)}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hide{display:none!important}

/* ===== styles/02-shell.css ===== */
/* ---------- APP SHELL ---------- */
#app{min-height:100vh}
.shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{background:var(--ink-900);color:var(--ink-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand-mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(150deg,var(--accent) 10%,#12A98C 90%);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:15px;flex:none}
.brand-name{font-family:var(--display);font-weight:600;font-size:15px;color:#fff;letter-spacing:-.01em}
.brand-sub{font-size:10.5px;color:var(--ink-text-2);letter-spacing:.04em}
.new-order-btn{margin:4px 12px 12px;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:#fff;border:0;border-radius:var(--r-md);padding:9px 12px;font-weight:600;font-size:13px;cursor:pointer;transition:background .12s}
.new-order-btn:hover{background:var(--accent-600)}
.nav{padding:0 8px 16px;display:flex;flex-direction:column;gap:1px}
.nav-group{margin-top:14px;padding:0 8px 6px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#5C7089}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--ink-text);cursor:pointer;font-size:13.5px;font-weight:500;border:0;background:none;width:100%;text-align:left;transition:background .1s}
.nav-item:hover{background:var(--ink-700)}
.nav-item.active{background:var(--ink-600);color:#fff}
.nav-item .ico{width:16px;height:16px;flex:none;opacity:.85}
.nav-item.active .ico{opacity:1}
.nav-badge{margin-left:auto;background:var(--crit);color:#fff;border-radius:999px;font-size:10.5px;font-weight:600;padding:1px 6px;font-family:var(--mono)}
.nav-badge.quiet{background:var(--ink-600);color:var(--ink-text)}
.sidebar-foot{margin-top:auto;padding:12px;border-top:1px solid var(--ink-line);display:flex;align-items:center;gap:9px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-tint-2);color:var(--accent-700);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;font-family:var(--display)}
.sidebar-foot .avatar{background:var(--ink-600);color:#fff}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px;position:sticky;top:0;z-index:30}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);font-size:13px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.content{padding:20px 22px 64px;max-width:1360px;width:100%}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:600}
.page-sub{color:var(--text-2);font-size:13px;margin-top:3px}

/* ---------- CONTROLS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-600);border-color:var(--accent-600)}
.btn.danger{color:var(--crit);border-color:var(--line-strong)}
.btn.danger:hover{background:var(--crit-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.lg{padding:10px 16px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-group{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.btn-group button{border:0;background:none;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--text-2);border-right:1px solid var(--line)}
.btn-group button:last-child{border-right:0}
.btn-group button.on{background:var(--accent-tint);color:var(--accent-700);font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11.5px;font-weight:600;color:var(--text-2);letter-spacing:.02em}
.field input,.field select,.field textarea{padding:7px 9px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);font-size:13px;width:100%}
.field textarea{resize:vertical;min-height:64px;font-family:var(--sans)}
.field .hint{font-size:11.5px;color:var(--text-3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.switch{position:relative;width:34px;height:19px;border-radius:999px;background:var(--line-strong);border:0;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(15px)}
.switch-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.switch-row:last-child{border-bottom:0}
.switch-row .t{font-weight:500;font-size:13px}
.switch-row .d{font-size:12px;color:var(--text-3);margin-top:1px}

/* ---------- SURFACES ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-head h3{font-size:14px;font-weight:600}
.card-body{padding:16px}
.card-body.tight{padding:0}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;gap:16px}
.cols.c2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.cols.c3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.cols.detail{grid-template-columns:minmax(0,1fr) 330px}
@media(max-width:1080px){.cols.detail{grid-template-columns:1fr}}

/* ---------- CHIPS / STATUS ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.7;white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.new{background:var(--st-new-bg);color:var(--st-new)}
.chip.concept{background:var(--st-concept-bg);color:var(--st-concept)}
.chip.reserved{background:var(--st-reserved-bg);color:var(--st-reserved)}
.chip.started{background:var(--st-started-bg);color:var(--st-started)}
.chip.stopped{background:var(--st-stopped-bg);color:var(--st-stopped)}
.chip.mixed{background:var(--st-mixed-bg);color:var(--st-mixed)}
.chip.archived{background:var(--st-archived-bg);color:var(--st-archived)}
.chip.canceled{background:var(--st-canceled-bg);color:var(--st-canceled)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--crit-bg);color:var(--crit)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.plain{background:var(--surface-3);color:var(--text-2)}
.tag{display:inline-flex;padding:1px 7px;border-radius:var(--r-sm);background:var(--surface-3);color:var(--text-2);font-size:11px;font-weight:500}

/* ---------- TABLES ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr{cursor:pointer}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl tr.norow{cursor:default}
table.tbl tr.norow:hover{background:transparent}
td.r,th.r{text-align:right}
.empty{padding:44px 20px;text-align:center;color:var(--text-3)}
.empty .big{font-size:15px;font-weight:600;color:var(--text-2);margin-bottom:4px;font-family:var(--display)}

/* ---------- TABS ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:16px}
.tabs button{border:0;background:none;padding:8px 12px;font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs .count{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-left:5px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:12.5px;cursor:pointer;color:var(--text-2)}
.subtabs button.on{background:var(--accent-tint);border-color:var(--accent-tint-2);color:var(--accent-700);font-weight:600}

/* ===== styles/03-data.css ===== */
/* ---------- METRIC TILES ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 14px;box-shadow:var(--shadow-1);position:relative;overflow:hidden}
.tile .k{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
.tile .v{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.tile .m{font-size:12px;color:var(--text-3);margin-top:3px}
.tile .m .up{color:var(--good);font-weight:600}
.tile .m .down{color:var(--crit);font-weight:600}
.tile.alert{border-color:var(--crit)}
.tile.alert .v{color:var(--crit)}
.tile .spark{position:absolute;right:0;bottom:0;opacity:.5}

/* ---------- DASHBOARD LISTS ---------- */
.oplist{display:flex;flex-direction:column}
.op{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
.op:last-child{border-bottom:0}
.op:hover{background:var(--surface-2)}
.op .time{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--text-2);width:52px;flex:none;text-align:right}
.op .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--line-strong);flex:none;min-height:32px}
.op.late .bar{background:var(--crit)}
.op.due .bar{background:var(--warn)}
.op .who{font-weight:600;font-size:13px}
.op .meta{font-size:12px;color:var(--text-3);margin-top:1px}
.op .go{opacity:0;color:var(--text-3);flex:none;transition:opacity .1s}
.op:hover .go{opacity:1}

/* ---------- ORDER DETAIL ---------- */
.order-hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-1);margin-bottom:16px}
.order-num{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.01em}
.stepper{display:flex;align-items:center;gap:0;margin-top:14px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 10px;font-size:12px;font-weight:600;color:var(--text-3);background:var(--surface-3);position:relative;border-radius:var(--r-sm);margin-right:6px}
.step .n{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:10px;background:var(--line-strong);color:var(--surface);font-family:var(--mono)}
.step.done{background:var(--accent-tint);color:var(--accent-700)}
.step.done .n{background:var(--accent);color:var(--on-accent)}
.step.now{background:var(--accent);color:var(--on-accent)}
.step.now .n{background:rgba(255,255,255,.28);color:inherit}
.lines td{vertical-align:top}
.lines .pname{font-weight:600}
.lines .psku{font-family:var(--mono);font-size:11.5px;color:var(--text-3);margin-top:2px}
.totals{margin-left:auto;width:min(340px,100%);display:flex;flex-direction:column;gap:0}
.totals .tr{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
.totals .tr:last-child{border-bottom:0}
.totals .tr.grand{font-weight:700;font-size:15px;padding-top:10px;font-family:var(--display)}
.totals .tr.due{color:var(--crit);font-weight:600}
.totals .tr.due.settled{color:var(--good)}
.qty-in{width:56px;padding:4px 6px;text-align:center;font-family:var(--mono);border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface)}
.side-block{border-bottom:1px solid var(--line);padding:13px 15px}
.side-block:last-child{border-bottom:0}
.side-block .lbl{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:7px}

/* ---------- TIMELINE / ACTIVITY ---------- */

  Data.orders().filter(o => !['canceled', 'concept'].includes(o.status)).forEach(o => {
    o.lines.forEach(l => {
      if (!l.productId) return;
      const m = map[l.productId] || (map[l.productId] = { qty: 0, rev: 0, orders: 0, days: 0 });
      m.qty += l.qty; m.rev += lineTotal(l, o); m.orders++;
      m.days += daysBetween(o.startsAt, o.stopsAt) * l.qty;
    });
  });
  return Object.entries(map).map(([pid, m]) => {
    const p = Data.product(pid);
    return { p, ...m, util: p.stock ? Math.min(100, (m.days / (p.stock * 90)) * 100) : 0 };
  }).sort((a, b) => b.rev - a.rev);
}

    'order.clearSignature': () => {
      const c = document.querySelector('#sigpad');
      if (c) { c.getContext('2d').clearRect(0, 0, c.width, c.height); delete c.dataset.signed; }
    },
    'order.sign': ({ data, render }) => {
      const o = Data.order(data.order);
      o.signature = Data.customer(o.customerId).contact;
      o.signedAt = new Date().toISOString();
      Store.changed('orders'); logActivity(o.id, `Signature collected from ${o.signature}`);
      toast('Signature captured'); render();
    },
    'order.bulkArchive': ({ S, render }) => {
      let n = 0;
      S.selection.forEach(id => {
        const o = Data.order(id);
        if (o && ['stopped', 'canceled'].includes(o.status)) { o.status = 'archived'; logActivity(id, 'Archived in bulk'); n++; }
      });
      Store.changed('orders');
      toast(`${n} archived — only returned or canceled orders can be`);
      S.selection.clear(); render();
    },
    'order.bulkTag': ({ S, render }) => {
      const t = prompt('Tag to add', 'priority');
      if (!t) return;
      S.selection.forEach(id => { const o = Data.order(id); if (o && !o.tags.includes(t)) o.tags.push(t); });
      Store.changed('orders'); toast(`Tagged ${S.selection.size} order(s)`); S.selection.clear(); render();
    },
    'selection.clear': ({ S, render }) => { S.selection.clear(); render(); },

    /* payments */
    'payment.new': ({ data }) => openPayment(Data.order(data.order)),
    'payment.confirm': ({ data, render }) => confirmPayment(Data.order(data.order), render),
    'payment.request': ({ data, render }) => {
      const o = Data.order(data.order);
      logActivity(o.id, 'Payment link emailed to the customer');
      toast(`Payment link sent to ${Data.customer(o.customerId).email}`); render();
    },
    'payment.holdDeposit': ({ data, render }) => {
      const o = Data.order(data.order);
      Store.insert('payments', { id: uid('pay'), orderId: o.id, amount: o.deposit, method: 'Credit card',
        kind: 'Security deposit hold', when: new Date().toISOString(), status: 'Authorized' });
      logActivity(o.id, `Security deposit of ${money(o.deposit)} authorised`);
      toast('Deposit held'); render();
    },
    'payment.capture': ({ data, render }) => {
      const p = Data.payments().find(x => x.id === data.payment);
      const keep = +prompt(`Capture how much of the ${money(p.amount)} hold? 0 releases it in full.`, '0') || 0;
      if (keep > 0) { p.status = 'Paid'; p.amount = keep; p.kind = 'Deposit captured'; logActivity(p.orderId, `${money(keep)} captured from the deposit`); }
      else { p.status = 'Released'; logActivity(p.orderId, 'Security deposit released'); }
      Store.changed('payments');
      toast(keep > 0 ? `${money(keep)} captured` : 'Deposit released'); render();
    }
  }
});

    <td>

/* ---------- modals ---------- */
const newLine = p => ({ id: uid('ln'), kind: 'product', productId: p.id, title: p.name, sku: p.sku,
  qty: 1, priceEach: p.price, taxProfile: p.taxProfile, pickedQty: 0, returnedQty: 0, stockItemIds: [] });

function openNewOrder(customerId, productId, render) {
  const d = Data.orderDefaults();
  const start = new Date(); start.setHours(+d.pickupTime.slice(0, 2), 0, 0, 0);
  const stop = new Date(start); stop.setDate(stop.getDate() + 1); stop.setHours(+d.returnTime.slice(0, 2), 0, 0, 0);
  const iso = x => new Date(x.getTime() - x.getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
  Modal.open({
    title: 'New order', sub: 'Pick a customer and a rental period — items come next.',
    body: `<div class="grid2">
      <div class="field"><label>Customer</label><select id="no-cust"><option value="">— choose a customer —</option>
        ${Data.customers().map(c => `<option value="${c.id}"${customerId === c.id ? ' selected' : ''}>${esc(c.name)} · ${esc(c.number)}</option>`).join('')}</select></div>

        ${Data.locations().filter(l => l.type !== 'Inventory only').map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></div>

      <option>Back office</option><option>Mobile POS</option><option>Online store</option></select></div>

    foot: `<button class="btn" data-close-modal>Cancel</button>
      <button class="btn" data-act="order.create" data-mode="concept"${productId ? ` data-product="${productId}"` : ''}>Save as concept</button>
      <button class="btn primary" data-act="order.create" data-mode="reserved"${productId ? ` data-product="${productId}"` : ''}>Create & reserve</button>`
  });

function createOrder(mode, productId, go) {
  const customerId = document.querySelector('#no-cust').value;
  if (!customerId) return toast('Pick a customer first', 'bad');
  const seq = (Store.config('orderSequence') || 1059) + 1;
  Store.setConfig('orderSequence', seq);
  const order = {
    id: uid('o'), number: seq, status: mode, customerId,
    source: document.querySelector('#no-src').value,
    locationId: document.querySelector('#no-loc').value,
    startsAt: new Date(document.querySelector('#no-start').value).toISOString(),
    stopsAt: new Date(document.querySelector('#no-stop').value).toISOString(),
    createdAt: new Date().toISOString(), deposit: 0, couponId: null,
    lines: [], fields: {}, tags: [], signature: null, signedAt: null
  };
  if (productId) { const p = Data.product(productId); order.lines.push(newLine(p)); order.deposit = p.deposit; }
  Store.insert('orders', order);
  logActivity(order.id, 'Order created from the back office');
  if (mode === 'reserved') logActivity(order.id, 'Status changed to Reserved', true);
  Modal.close();
  toast(`Order #${order.number} created`);
  go('orders', order.id);
}

function duplicateOrder(o, go) {
  const seq = (Store.config('orderSequence') || 1059) + 1;
  Store.setConfig('orderSequence', seq);
  const copy = JSON.parse(JSON.stringify(o));
  Object.assign(copy, { id: uid('o'), number: seq, status: 'concept', createdAt: new Date().toISOString(),
    signature: null, signedAt: null, shortages: undefined });
  copy.lines.forEach(l => { l.id = uid('ln'); l.pickedQty = 0; l.returnedQty = 0; l.stockItemIds = []; });
  Store.insert('orders', copy);
  logActivity(copy.id, `Duplicated from order #${o.number}`);
  toast(`Created #${copy.number} as a concept`);
  go('orders', copy.id);
}

function openProductPicker(o) {
  Modal.open({
    title: 'Add products', sub: `Availability shown for ${fmtD(o.startsAt)} → ${fmtD(o.stopsAt)}`, size: 'wide',
    body: `<div class="search" style="margin-bottom:12px">${icon('search', 15, 2)}

      q.addEventListener('input', () => { root.querySelector('#picker-list').innerHTML = productPickerList(o, q.value); });

function productPickerList(o, q) {
  q = q.toLowerCase();
  return Data.products()
    .filter(p => !q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q))
    .slice(0, 40).map(p => {
      const a = availableQty(p.id, o.startsAt, o.stopsAt, o.id);
      const on = o.lines.find(l => l.productId === p.id);
      return `<div class="picker-item ${on ? 'sel' : ''}" data-act="order.pickProduct" data-product="${p.id}" data-order="${o.id}">
        <span class="thumb">${p.icon}</span>
        <div class="grow"><div style="font-weight:600">${esc(p.name)}</div>
          <div class="mono dim" style="font-size:11.5px">${esc(p.sku)} · ${money(p.price)}/${p.period}${p.deposit ? ` · ${money(p.deposit)} deposit` : ''}</div></div>
        ${['rental', 'bundle'].includes(p.type) ? chip(`${a} free`, a <= 0 ? 'crit' : a <= 2 ? 'warn' : 'good', false) : chip(p.type, 'plain', false)}
        ${on ? chip(`${on.qty} on order`, 'info', false) : ''}
      </div>`;
    }).join('') || empty('No products match');

function openPickup(o) {
  const rows = o.lines.filter(l => l.pickedQty < l.qty);
  Modal.open({
    title: `Pick up items · #${o.number}`, size: 'wide',
    sub: 'Tick what is physically going out. Trackable products need a specific unit.',
    body: `${banner('info', 'Scan each barcode or tick by hand. A partial pickup puts the order into <b>Mixed</b> — the rest stays reserved.')}
      <div style="margin-top:14px"></div>
      ${rows.map(l => {
        const p = l.productId ? Data.product(l.productId) : null;
        const free = p && p.track === 'trackable'
          ? Data.stockItems().filter(si => si.productId === p.id && si.condition !== 'maintenance'
              && !Data.orders().some(oo => oo.id !== o.id && oo.lines.some(ll => ll.stockItemIds.includes(si.id))))
          : [];
        const need = l.qty - l.pickedQty;
        return `<div class="checkline on" style="align-items:flex-start;flex-direction:column;gap:8px">
          <div class="row" style="width:100%"><input type="checkbox" checked data-pick="${l.id}">
            <div class="grow"><div style="font-weight:600">${esc(l.title)}</div>
              <div class="mono dim" style="font-size:11.5px">${esc(l.sku)} · ${need} to go out</div></div>
            <input class="qty-in" type="number" min="0" max="${need}" value="${need}" data-pick-qty="${l.id}"></div>
          ${p && p.track === 'trackable' ? `<div class="wrap" style="padding-left:26px">
            ${free.slice(0, Math.max(3, l.qty)).map((si, i) => `<label class="chip ${i < need ? 'good' : 'plain'}" style="cursor:pointer">
              <input type="checkbox"${i < need ? ' checked' : ''} data-pick-item="${l.id}" value="${si.id}" style="margin-right:4px">
              <span class="mono">${esc(si.identifier)}</span></label>`).join('')
              || '<span class="dim" style="font-size:12px">No free units — this line is short.</span>'}
          </div>` : ''}
        </div>`;
      }).join('') || empty('Everything on this order is already out.')}
      <div class="field" style="margin-top:14px"><label>Signature</label>
        <canvas class="sigpad" id="sigpad" width="560" height="130"></canvas>
        <span class="hint">The customer signs here. Required before pickup by your order settings.</span></div>`,
    foot: `<button class="btn" data-close-modal>Cancel</button>
      <button class="btn ghost" data-act="order.clearSignature">Clear signature</button>
      <button class="btn pick" data-act="order.confirmPickup" data-order="${o.id}">Pick up items</button>`,
    onMount: root => initSigpad(root.querySelector('#sigpad'))
  });
}

function confirmPickup(o, render) {
  const root = document.getElementById('modal-root');
