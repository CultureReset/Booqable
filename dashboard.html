<title>Booqable Operator Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   BOOQABLE OPERATOR CONSOLE — functional rebuild
   Tokens: light is defined on bare :root, dark redefined twice
   ============================================================ */
:root{
  --ink-900:#0B1220; --ink-800:#131E31; --ink-700:#1E2C43; --ink-600:#2B3B55;
  --ink-text:#C3D0E0; --ink-text-2:#8496AD; --ink-line:#22304A;

  --canvas:#F3F6FA; --surface:#FFFFFF; --surface-2:#F8FAFC; --surface-3:#EEF2F7;
  --line:#DEE6EF; --line-strong:#C4D0DE;
  --text:#15202E; --text-2:#4B5C71; --text-3:#7D8DA0;

  --accent:#0B7285; --accent-600:#095E6E; --accent-700:#074C59;
  --accent-tint:#E3F0F3; --accent-tint-2:#CFE5EA; --on-accent:#FFFFFF;

  --st-new:#64748B;      --st-new-bg:#EDF1F6;
  --st-concept:#5B6B80;  --st-concept-bg:#ECF0F5;
  --st-reserved:#2563EB; --st-reserved-bg:#E6EEFE;
  --st-started:#A85B06;  --st-started-bg:#FCEFD9;
  --st-stopped:#15803D;  --st-stopped-bg:#E1F4E8;
  --st-mixed:#6D28D9;    --st-mixed-bg:#EFE9FD;
  --st-archived:#8494A6; --st-archived-bg:#F0F3F7;
  --st-canceled:#B4231C; --st-canceled-bg:#FBE8E7;

  --good:#15803D; --good-bg:#E1F4E8;
  --warn:#A85B06; --warn-bg:#FCEFD9;
  --crit:#B4231C; --crit-bg:#FBE8E7;
  --info:#2563EB; --info-bg:#E6EEFE;

  --seq-1:#E3F0F3; --seq-2:#B9DBE2; --seq-3:#84BECB; --seq-4:#4A9DAF; --seq-5:#0B7285;

  --shadow-1:0 1px 2px rgba(15,32,48,.06), 0 1px 3px rgba(15,32,48,.04);
  --shadow-2:0 4px 12px rgba(15,32,48,.08), 0 1px 3px rgba(15,32,48,.05);
  --shadow-3:0 18px 48px rgba(11,24,40,.20), 0 2px 8px rgba(11,24,40,.10);

  --r-sm:5px; --r-md:8px; --r-lg:12px; --r-xl:16px;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display:"Archivo", var(--sans);
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --sidebar-w:236px; --topbar-h:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink-900:#070C15; --ink-800:#0C1421; --ink-700:#16223A; --ink-600:#22314C;
    --ink-text:#B9C7DA; --ink-text-2:#7688A0; --ink-line:#1A2740;
    --canvas:#0B121D; --surface:#121B2A; --surface-2:#0F1826; --surface-3:#1A2536;
    --line:#233145; --line-strong:#33455E;
    --text:#E4EBF4; --text-2:#A2B2C6; --text-3:#758699;
    --accent:#31A3B8; --accent-600:#48B6C9; --accent-700:#66C7D7;
    --accent-tint:#12303A; --accent-tint-2:#17414F; --on-accent:#04222A;
    --st-new:#94A3B8;      --st-new-bg:#1C2739;
    --st-concept:#98A7BA;  --st-concept-bg:#1B2536;
    --st-reserved:#7DA6FF; --st-reserved-bg:#152546;
    --st-started:#E8A03C;  --st-started-bg:#33240D;
    --st-stopped:#4ECB7B;  --st-stopped-bg:#0E2C1A;
    --st-mixed:#B292F5;    --st-mixed-bg:#231A3D;
    --st-archived:#8494A6; --st-archived-bg:#1A2434;
    --st-canceled:#F0736A; --st-canceled-bg:#331615;
    --good:#4ECB7B; --good-bg:#0E2C1A;
    --warn:#E8A03C; --warn-bg:#33240D;
    --crit:#F0736A; --crit-bg:#331615;
    --info:#7DA6FF; --info-bg:#152546;
    --seq-1:#12303A; --seq-2:#17495A; --seq-3:#1F6B81; --seq-4:#2A8DA6; --seq-5:#43B4CB;
    --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 4px 14px rgba(0,0,0,.45);
    --shadow-3:0 18px 48px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ink-900:#070C15; --ink-800:#0C1421; --ink-700:#16223A; --ink-600:#22314C;
  --ink-text:#B9C7DA; --ink-text-2:#7688A0; --ink-line:#1A2740;
  --canvas:#0B121D; --surface:#121B2A; --surface-2:#0F1826; --surface-3:#1A2536;
  --line:#233145; --line-strong:#33455E;
  --text:#E4EBF4; --text-2:#A2B2C6; --text-3:#758699;
  --accent:#31A3B8; --accent-600:#48B6C9; --accent-700:#66C7D7;
  --accent-tint:#12303A; --accent-tint-2:#17414F; --on-accent:#04222A;
  --st-new:#94A3B8;      --st-new-bg:#1C2739;
  --st-concept:#98A7BA;  --st-concept-bg:#1B2536;
  --st-reserved:#7DA6FF; --st-reserved-bg:#152546;
  --st-started:#E8A03C;  --st-started-bg:#33240D;
  --st-stopped:#4ECB7B;  --st-stopped-bg:#0E2C1A;
  --st-mixed:#B292F5;    --st-mixed-bg:#231A3D;
  --st-archived:#8494A6; --st-archived-bg:#1A2434;
  --st-canceled:#F0736A; --st-canceled-bg:#331615;
  --good:#4ECB7B; --good-bg:#0E2C1A;
  --warn:#E8A03C; --warn-bg:#33240D;
  --crit:#F0736A; --crit-bg:#331615;
  --info:#7DA6FF; --info-bg:#152546;
  --seq-1:#12303A; --seq-2:#17495A; --seq-3:#1F6B81; --seq-4:#2A8DA6; --seq-5:#43B4CB;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 4px 14px rgba(0,0,0,.45);
  --shadow-3:0 18px 48px rgba(0,0,0,.6);
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.012em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
.dim{color:var(--text-3)}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hide{display:none!important}
</style>
<style>
/* ---------- APP SHELL ---------- */
#app{min-height:100vh}
.shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{background:var(--ink-900);color:var(--ink-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand-mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(150deg,var(--accent) 10%,#12A98C 90%);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:15px;flex:none}
.brand-name{font-family:var(--display);font-weight:600;font-size:15px;color:#fff;letter-spacing:-.01em}
.brand-sub{font-size:10.5px;color:var(--ink-text-2);letter-spacing:.04em}
.new-order-btn{margin:4px 12px 12px;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:#fff;border:0;border-radius:var(--r-md);padding:9px 12px;font-weight:600;font-size:13px;cursor:pointer;transition:background .12s}
.new-order-btn:hover{background:var(--accent-600)}
.nav{padding:0 8px 16px;display:flex;flex-direction:column;gap:1px}
.nav-group{margin-top:14px;padding:0 8px 6px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#5C7089}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--ink-text);cursor:pointer;font-size:13.5px;font-weight:500;border:0;background:none;width:100%;text-align:left;transition:background .1s}
.nav-item:hover{background:var(--ink-700)}
.nav-item.active{background:var(--ink-600);color:#fff}
.nav-item .ico{width:16px;height:16px;flex:none;opacity:.85}
.nav-item.active .ico{opacity:1}
.nav-badge{margin-left:auto;background:var(--crit);color:#fff;border-radius:999px;font-size:10.5px;font-weight:600;padding:1px 6px;font-family:var(--mono)}
.nav-badge.quiet{background:var(--ink-600);color:var(--ink-text)}
.sidebar-foot{margin-top:auto;padding:12px;border-top:1px solid var(--ink-line);display:flex;align-items:center;gap:9px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-tint-2);color:var(--accent-700);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;font-family:var(--display)}
.sidebar-foot .avatar{background:var(--ink-600);color:#fff}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px;position:sticky;top:0;z-index:30}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);font-size:13px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.content{padding:20px 22px 64px;max-width:1360px;width:100%}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:600}
.page-sub{color:var(--text-2);font-size:13px;margin-top:3px}

/* ---------- CONTROLS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-600);border-color:var(--accent-600)}
.btn.danger{color:var(--crit);border-color:var(--line-strong)}
.btn.danger:hover{background:var(--crit-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.lg{padding:10px 16px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-group{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.btn-group button{border:0;background:none;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--text-2);border-right:1px solid var(--line)}
.btn-group button:last-child{border-right:0}
.btn-group button.on{background:var(--accent-tint);color:var(--accent-700);font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11.5px;font-weight:600;color:var(--text-2);letter-spacing:.02em}
.field input,.field select,.field textarea{padding:7px 9px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);font-size:13px;width:100%}
.field textarea{resize:vertical;min-height:64px;font-family:var(--sans)}
.field .hint{font-size:11.5px;color:var(--text-3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.switch{position:relative;width:34px;height:19px;border-radius:999px;background:var(--line-strong);border:0;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(15px)}
.switch-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.switch-row:last-child{border-bottom:0}
.switch-row .t{font-weight:500;font-size:13px}
.switch-row .d{font-size:12px;color:var(--text-3);margin-top:1px}

/* ---------- SURFACES ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-head h3{font-size:14px;font-weight:600}
.card-body{padding:16px}
.card-body.tight{padding:0}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;gap:16px}
.cols.c2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.cols.c3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.cols.detail{grid-template-columns:minmax(0,1fr) 330px}
@media(max-width:1080px){.cols.detail{grid-template-columns:1fr}}

/* ---------- CHIPS / STATUS ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.7;white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.new{background:var(--st-new-bg);color:var(--st-new)}
.chip.concept{background:var(--st-concept-bg);color:var(--st-concept)}
.chip.reserved{background:var(--st-reserved-bg);color:var(--st-reserved)}
.chip.started{background:var(--st-started-bg);color:var(--st-started)}
.chip.stopped{background:var(--st-stopped-bg);color:var(--st-stopped)}
.chip.mixed{background:var(--st-mixed-bg);color:var(--st-mixed)}
.chip.archived{background:var(--st-archived-bg);color:var(--st-archived)}
.chip.canceled{background:var(--st-canceled-bg);color:var(--st-canceled)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--crit-bg);color:var(--crit)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.plain{background:var(--surface-3);color:var(--text-2)}
.tag{display:inline-flex;padding:1px 7px;border-radius:var(--r-sm);background:var(--surface-3);color:var(--text-2);font-size:11px;font-weight:500}

/* ---------- TABLES ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr{cursor:pointer}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl tr.norow{cursor:default}
table.tbl tr.norow:hover{background:transparent}
td.r,th.r{text-align:right}
.empty{padding:44px 20px;text-align:center;color:var(--text-3)}
.empty .big{font-size:15px;font-weight:600;color:var(--text-2);margin-bottom:4px;font-family:var(--display)}

/* ---------- TABS ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:16px}
.tabs button{border:0;background:none;padding:8px 12px;font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs .count{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-left:5px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:12.5px;cursor:pointer;color:var(--text-2)}
.subtabs button.on{background:var(--accent-tint);border-color:var(--accent-tint-2);color:var(--accent-700);font-weight:600}
</style>
<style>
/* ---------- METRIC TILES ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 14px;box-shadow:var(--shadow-1);position:relative;overflow:hidden}
.tile .k{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
.tile .v{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.tile .m{font-size:12px;color:var(--text-3);margin-top:3px}
.tile .m .up{color:var(--good);font-weight:600}
.tile .m .down{color:var(--crit);font-weight:600}
.tile.alert{border-color:var(--crit)}
.tile.alert .v{color:var(--crit)}
.tile .spark{position:absolute;right:0;bottom:0;opacity:.5}

/* ---------- DASHBOARD LISTS ---------- */
.oplist{display:flex;flex-direction:column}
.op{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
.op:last-child{border-bottom:0}
.op:hover{background:var(--surface-2)}
.op .time{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--text-2);width:52px;flex:none;text-align:right}
.op .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--line-strong);flex:none;min-height:32px}
.op.late .bar{background:var(--crit)}
.op.due .bar{background:var(--warn)}
.op .who{font-weight:600;font-size:13px}
.op .meta{font-size:12px;color:var(--text-3);margin-top:1px}
.op .go{opacity:0;color:var(--text-3);flex:none;transition:opacity .1s}
.op:hover .go{opacity:1}

/* ---------- ORDER DETAIL ---------- */
.order-hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-1);margin-bottom:16px}
.order-num{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.01em}
.stepper{display:flex;align-items:center;gap:0;margin-top:14px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 10px;font-size:12px;font-weight:600;color:var(--text-3);background:var(--surface-3);position:relative;border-radius:var(--r-sm);margin-right:6px}
.step .n{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:10px;background:var(--line-strong);color:var(--surface);font-family:var(--mono)}
.step.done{background:var(--accent-tint);color:var(--accent-700)}
.step.done .n{background:var(--accent);color:var(--on-accent)}
.step.now{background:var(--accent);color:var(--on-accent)}
.step.now .n{background:rgba(255,255,255,.28);color:inherit}
.lines td{vertical-align:top}
.lines .pname{font-weight:600}
.lines .psku{font-family:var(--mono);font-size:11.5px;color:var(--text-3);margin-top:2px}
.totals{margin-left:auto;width:min(340px,100%);display:flex;flex-direction:column;gap:0}
.totals .tr{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
.totals .tr:last-child{border-bottom:0}
.totals .tr.grand{font-weight:700;font-size:15px;padding-top:10px;font-family:var(--display)}
.totals .tr.due{color:var(--crit);font-weight:600}
.totals .tr.due.settled{color:var(--good)}
.qty-in{width:56px;padding:4px 6px;text-align:center;font-family:var(--mono);border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface)}
.side-block{border-bottom:1px solid var(--line);padding:13px 15px}
.side-block:last-child{border-bottom:0}
.side-block .lbl{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:7px}

/* ---------- TIMELINE / ACTIVITY ---------- */
.tl{position:relative;padding-left:20px}

const startOfDay = d => {const x=new Date(d);x.setHours(0,0,0,0);return x};
const dkey = d => startOfDay(d).toISOString().slice(0,10);
const fmtT = s => D(s).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const fmtD = s => D(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const fmtDY= s => D(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const fmtDT= s => fmtD(s)+' · '+fmtT(s);
const fmtRel = s => {
  const diff = (Date.now()-D(s))/36e5;
  if(diff<1) return Math.max(1,Math.round(diff*60))+'m ago';
  if(diff<24) return Math.round(diff)+'h ago';
  if(diff<48) return 'Yesterday';
  return fmtDY(s);
};
const daysBetween = (a,b)=>Math.max(1, Math.ceil((D(b)-D(a))/864e5));
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- pricing ---- */
function chargeUnits(product, order){
  if(!product) return daysBetween(order.startsAt, order.stopsAt);
  const d = daysBetween(order.startsAt, order.stopsAt);
  if(product.period==='once' || product.period==='order' || product.priceType==='fixed') return 1;
  if(product.priceType==='flat') return d;
  const st = DB.pricingStructures.find(s=>s.id===product.structure);
  if(!st) return d;
  if(d>=30) return st.rows[st.rows.length-1].mult;
  if(d>=7)  return (st.rows.find(r=>/Week/.test(r.label))||{mult:d}).mult;
  const row = st.rows[Math.min(d-1, st.rows.length-1)];
  return row ? row.mult : d;
}
function lineTotal(line, order){
  const p = line.productId ? getProduct(line.productId) : null;
  const units = line.kind==='custom' ? 1 : chargeUnits(p, order);
  return line.qty * line.priceEach * units;
}
function taxRateFor(profileId){
  const tp = DB.taxProfiles.find(t=>t.id===profileId) || DB.taxProfiles[0];
  return tp.rates.reduce((s,rid)=>s+(DB.taxRates.find(r=>r.id===rid)?.rate||0),0);
}
function orderTotals(order){
  const cust = getCustomer(order.customerId);
  const sub = order.lines.reduce((s,l)=>s+lineTotal(l,order),0);
  const custDisc = cust ? sub*(cust.discount/100) : 0;
  const cpn = DB.coupons.find(c=>c.id===order.couponId);
  let cpnDisc = 0;
  if(cpn) cpnDisc = cpn.kind==='Percentage' ? (sub-custDisc)*(cpn.value/100) : cpn.value;
  const taxable = sub - custDisc - cpnDisc;
  const rate = order.lines.length ? taxRateFor(order.lines[0].taxProfile) : 0;
  const custTP = cust ? cust.taxProfile : 'tp_std';
  const effRate = custTP==='tp_exempt' ? 0 : rate;
  const tax = taxable * (effRate/100);
  const total = taxable + tax;
  const paid = order.payments.filter(p=>p.kind!=='Security deposit hold'&&p.status==='Paid').reduce((s,p)=>s+p.amount,0);
  const heldDeposit = order.payments.filter(p=>p.kind==='Security deposit hold'&&p.status==='Authorized').reduce((s,p)=>s+p.amount,0);
  return {sub, custDisc, cpnDisc, cpn, taxable, effRate, tax, total, paid, due:total-paid, heldDeposit, deposit:order.deposit};
}

/* ---- availability ---- */
const HELD = ['reserved','started','mixed'];
function reservedQty(productId, from, to, ignoreOrderId){
  let q = 0;
  DB.orders.forEach(o=>{
    if(o.id===ignoreOrderId) return;
    if(!HELD.includes(o.status)) return;
    const p = getProduct(productId);
    const buf = (p?.buffer||0)*864e5;
    if(D(o.stopsAt).getTime()+buf <= D(from).getTime()) return;
    if(D(o.startsAt).getTime()-buf >= D(to).getTime()) return;
    o.lines.forEach(l=>{
      if(l.productId===productId) q += l.qty - (l.returnedQty||0);
      const bp = l.productId ? getProduct(l.productId) : null;
      if(bp && bp.bundle && bp.bundle.includes(productId)) q += l.qty;
    });
  });
  DB.downtime.forEach(d=>{
    if(d.productId!==productId) return;
    if(D(d.to)<=D(from) || D(d.from)>=D(to)) return;
    q += d.qty;
  });
  return q;
}
function availableQty(productId, from, to, ignoreOrderId){
  const p = getProduct(productId); if(!p) return 0;
  return p.stock - reservedQty(productId, from, to, ignoreOrderId);
}
function orderShortages(order){
  const out = [];
  order.lines.forEach(l=>{
    if(!l.productId) return;
    const p = getProduct(l.productId); if(!p || p.type==='sales') return;
    const avail = availableQty(l.productId, order.startsAt, order.stopsAt, order.id);
    if(l.qty > avail){
      const gap = l.qty - avail;
      out.push({line:l, product:p, avail, gap, allowed: p.allowShortage && gap<=p.shortageLimit});
    }
  });
  return out;
}

/* ---- derived order helpers ---- */
const isLatePickup = o => o.status==='reserved' && D(o.startsAt) < new Date();
const isLateReturn = o => (o.status==='started'||o.status==='mixed') && D(o.stopsAt) < new Date();
const isLate = o => isLatePickup(o) || isLateReturn(o);
const totalItems = o => o.lines.reduce((s,l)=>s+l.qty,0);
const pickedItems = o => o.lines.reduce((s,l)=>s+(l.pickedQty||0),0);
const returnedItems = o => o.lines.reduce((s,l)=>s+(l.returnedQty||0),0);
function recomputeStatus(o){
  const t=totalItems(o), p=pickedItems(o), r=returnedItems(o);
  if(o.status==='canceled'||o.status==='archived'||o.status==='concept') return o.status;
  if(r>=t && t>0) return 'stopped';
  if(p>=t && t>0 && r===0) return 'started';
  if(p>0 && (r>0 || p<t)) return 'mixed';
  if(p>0) return 'started';
  return 'reserved';
}
function logActivity(orderId, what, hi=false){
  const a = act(orderId, what, ME().name, new Date().toISOString(), hi);
  DB.activity.unshift(a);
  const o = getOrder(orderId); if(o) o.activity.unshift(a);
}

  root.querySelector('[data-scrim]').addEventListener('mousedown',e=>{ if(e.target===e.currentTarget) closeModal(); });

}

function opRow(o, dir){

const ORDER_TABS = [

  {id:'all',      label:'All',       f:()=>true},
  {id:'concept',  label:'Concepts',  f:o=>o.status==='concept'},
  {id:'reserved', label:'Reserved',  f:o=>o.status==='reserved'},
  {id:'started',  label:'Picked up', f:o=>o.status==='started'||o.status==='mixed'},
  {id:'stopped',  label:'Returned',  f:o=>o.status==='stopped'},
  {id:'late',     label:'Overdue',   f:isLate},
  {id:'archived', label:'Archived',  f:o=>o.status==='archived'},
  {id:'canceled', label:'Canceled',  f:o=>o.status==='canceled'}
];
function filteredOrders(){
  const tab = ORDER_TABS.find(t=>t.id===S.orderFilter) || ORDER_TABS[0];
  const q = S.orderQuery.trim().toLowerCase();
  return DB.orders.filter(tab.f).filter(o=>{
    if(!q) return true;
    const c=getCustomer(o.customerId);
    return String(o.number).includes(q) || (c&&c.name.toLowerCase().includes(q)) ||
           o.lines.some(l=>l.title.toLowerCase().includes(q)||String(l.sku).toLowerCase().includes(q));
  }).sort((a,b)=>D(b.startsAt)-D(a.startsAt));
}

  const tabs = [
    {id:'lines', label:'Items & pricing'},
    {id:'documents', label:'Documents', n:docs.length},
    {id:'payments', label:'Payments', n:o.payments.length},
    {id:'notes', label:'Notes', n:o.notes.length},
    {id:'activity', label:'Activity', n:o.activity.length},
    {id:'fields', label:'Custom fields', n:Object.keys(o.fields).length}

        </div>

      ${o.status==='mixed'?`<span class="chip mixed" style="margin-left:6px"><span class="dot"></span>Mixed — ${pickedItems(o)-returnedItems(o)} of ${totalItems(o)} still out</span>`:''}

    ${shortages.map(s=>`<div style="margin-top:3px">${esc(s.product.name)} — booked ${s.line.qty}, available ${s.avail} (short ${s.gap})${s.allowed?` · within the ${s.product.shortageLimit}-unit shortage limit`:' · over the limit, this will block'}</div>`).join('')}
    </div></div>`:''}

  <div class="cols detail">

      <div class="tabs">${tabs.map(tb=>`<button class="${S.orderTab===tb.id?'on':''}" data-otabd="${tb.id}">${tb.label}${tb.n!==undefined?`<span class="count">${tb.n}</span>`:''}</button>`).join('')}</div>

function orderActions(o){
  const b=[];
  if(o.status==='concept') b.push(`<button class="btn primary" data-act="reserve">Reserve order</button>`);
  if(o.status==='reserved') b.push(`<button class="btn pick" data-act="pickup">Pick up items</button>`);
  if(o.status==='started'||o.status==='mixed') b.push(`<button class="btn ret" data-act="return">Return items</button>`);
  if(o.status==='started'||o.status==='mixed') b.push(`<button class="btn" data-act="pickup">Pick up more</button>`);
  if(o.status==='stopped') b.push(`<button class="btn primary" data-act="archive">Archive order</button>`);
  if(o.status==='archived') b.push(`<button class="btn" data-act="unarchive">Reopen</button>`);
  if(!['archived','canceled'].includes(o.status)) b.push(`<button class="btn" data-act="doc-menu">Documents ▾</button>`);
  b.push(`<button class="btn" data-act="duplicate">Duplicate</button>`);
  if(['concept','reserved'].includes(o.status)) b.push(`<button class="btn danger" data-act="cancel">Cancel</button>`);
  if(['reserved','started','mixed','stopped'].includes(o.status)) b.push(`<button class="btn ghost" data-act="revert" title="Step the order back one stage">Revert ↩</button>`);
  return b.join('');
}

function docChip(s){

/* ============================================================
   7. CALENDAR
   ============================================================ */
function viewCalendar(){
  const m=S.calMonth, first=new Date(m.getFullYear(),m.getMonth(),1);
  const startOffset=(first.getDay()+6)%7;  // Monday-first
  const gridStart=new Date(first); gridStart.setDate(1-startOffset);
  const cells=[...Array(42)].map((_,i)=>{const d=new Date(gridStart); d.setDate(gridStart.getDate()+i); return d;});
  const evs = d => {
    const out=[];
    DB.orders.forEach(o=>{
      if(['canceled'].includes(o.status)) return;
      if(sameDay(D(o.startsAt),d)) out.push({o,kind:'out'});
      if(sameDay(D(o.stopsAt),d))  out.push({o,kind:'in'});
    });
    return out.sort((a,b)=>D(a.kind==='out'?a.o.startsAt:a.o.stopsAt)-D(b.kind==='out'?b.o.startsAt:b.o.stopsAt));
  };
  return `
  <div class="page-head">
    <div><h1 class="page-title">Calendar</h1>
      <div class="page-sub">Every pickup and return, plus product-level availability across the window</div></div>
    <div class="row">
      <div class="btn-group"><button class="${S.calView==='month'?'on':''}" data-calview="month">Orders</button>
        <button class="${S.calView==='avail'?'on':''}" data-calview="avail">Availability</button></div>
      <button class="btn sm" data-cal="-1">←</button>
      <button class="btn sm" data-cal="0">Today</button>
      <button class="btn sm" data-cal="1">→</button>
    </div>
  </div>
  ${S.calView==='avail'?availabilityGrid():`
  <div class="row" style="margin-bottom:10px;justify-content:space-between">
    <h3 style="font-size:16px">${m.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h3>
    <div class="legend">
      <span><i style="background:var(--st-reserved)"></i>Reserved</span>
      <span><i style="background:var(--st-started)"></i>Picked up</span>
      <span><i style="background:var(--st-stopped)"></i>Returned</span>
      <span><i style="background:var(--st-concept)"></i>Concept</span>
      <span><i style="background:var(--crit)"></i>Overdue</span>
    </div>
  </div>
  <div class="cal"><div class="cal-grid">
    ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    ${cells.map(d=>{
      const list=evs(d), out=d.getMonth()!==m.getMonth();
      return `<div class="cal-cell ${out?'out':''} ${sameDay(d,new Date())?'today':''}">
        <div class="d">${d.getDate()}</div>
        ${list.slice(0,3).map(e=>{
          const late = e.kind==='out'?isLatePickup(e.o):isLateReturn(e.o);
          const cls = late?'canceled':STATUS[e.o.status].cls;
          const c=getCustomer(e.o.customerId);
          return `<div class="cal-ev chip ${cls}" data-go="orders" data-param="${e.o.id}" title="#${e.o.number} ${esc(c.name)}">
            <span class="arrow">${e.kind==='out'?'↑':'↓'}</span>#${e.o.number} ${esc(c.name.split(' ')[0])}</div>`;
        }).join('')}
        ${list.length>3?`<div class="cal-more">+${list.length-3} more</div>`:''}
      </div>`;
    }).join('')}
  </div></div>`}`;
}
function availabilityGrid(){
  const days=[...Array(14)].map((_,i)=>day(i));
  const prods=DB.products.filter(p=>p.type==='rental');
  return `
  <div class="row" style="margin-bottom:10px;justify-content:space-between;flex-wrap:wrap">
    <h3 style="font-size:16px">Availability · next 14 days</h3>
    <div class="legend">
      <span><i style="background:var(--seq-1)"></i>Mostly free</span>
      <span><i style="background:var(--seq-3)"></i>Half booked</span>
      <span><i style="background:var(--seq-5)"></i>Nearly out</span>
      <span><i style="background:var(--crit-bg);outline:1px solid var(--crit)"></i>Shortage</span>
    </div>
  </div>
  <div class="avail"><table>
    <thead><tr><th class="lead">Product</th>
      ${days.map(d=>`<th>${d.toLocaleDateString('en-US',{weekday:'narrow'})}<div class="num" style="font-weight:400">${d.getDate()}</div></th>`).join('')}
    </tr></thead><tbody>
    ${prods.map(p=>`<tr>
      <td class="lead"><a href="#/products/${p.id}" data-go="products" data-param="${p.id}" style="font-weight:500">${esc(p.name)}</a>
        <div class="mono dim" style="font-size:11px">${esc(p.sku)} · ${p.stock} owned</div></td>
      ${days.map(d=>{
        const from=startOfDay(d).toISOString(); const to=new Date(startOfDay(d).getTime()+864e5).toISOString();
        const a=availableQty(p.id,from,to);
        const used=p.stock-a, pct=p.stock?used/p.stock:0;
        const cls = a<0?'short':pct===0?'s0':pct<=.25?'s1':pct<=.5?'s2':pct<=.75?'s3':pct<1?'s4':'s5';
        return `<td><div class="cellv ${cls}" title="${esc(p.name)} · ${d.toDateString()} · ${a} of ${p.stock} free">${a}</div></td>`;
      }).join('')}
    </tr>`).join('')}
    </tbody></table></div>
  <div class="dim" style="font-size:12px;margin-top:9px">Each cell is the number of units still bookable that day, after reservations, buffer time and maintenance downtime. Red means more is booked than you own.</div>`;
}

function custStats(c){
  const os=DB.orders.filter(o=>o.customerId===c.id);
  const spend=os.filter(o=>!['canceled','concept'].includes(o.status)).reduce((s,o)=>s+orderTotals(o).total,0);
  const due=os.filter(o=>!['canceled','concept','archived'].includes(o.status)).reduce((s,o)=>s+Math.max(0,orderTotals(o).due),0);
  return {orders:os, count:os.length, spend, due};
}

          return top.length?top.map(([pid,q])=>{const p=getProduct(pid);return `<div class="spread" style="font-size:12.5px;padding:2px 0"><span class="trunc">${esc(p.name)}</span><span class="num dim">${q}×</span></div>`}).join(''):'<div class="dim" style="font-size:12.5px">Nothing yet.</div>';})()}</div>
    </aside>
  </div>`;
}

function avail21(p,days){
  return `<div class="avail" style="border:0"><table><thead><tr>
    ${days.map(d=>`<th>${d.toLocaleDateString('en-US',{weekday:'narrow'})}<div class="num" style="font-weight:400">${d.getDate()}</div></th>`).join('')}
  </tr></thead><tbody><tr>
    ${days.map(d=>{const from=startOfDay(d).toISOString(),to=new Date(startOfDay(d).getTime()+864e5).toISOString();
      const a=availableQty(p.id,from,to),pct=p.stock?(p.stock-a)/p.stock:0;
      const cls=a<0?'short':pct===0?'s0':pct<=.25?'s1':pct<=.5?'s2':pct<=.75?'s3':pct<1?'s4':'s5';
      return `<td><div class="cellv ${cls}" title="${a} free on ${d.toDateString()}">${a}</div></td>`}).join('')}
  </tr></tbody></table></div>`;
}
function barcodeSvg(code){
  let h=Math.abs(hashCode(code));
  const bars=[...Array(26)].map(()=>{const w=(h%3)+1;h=Math.floor(h/3)+((h%7)*13);return w});
  return `<div class="barcode" style="height:20px;margin-top:3px">${bars.map((w,i)=>`<i style="width:${w}px;height:${i%4===0?20:16}px;opacity:${i%2?0.15:1}"></i>`).join('')}</div>`;
}

function monthlyRevenue(){
  const out=[];
  for(let i=11;i>=0;i--){
    const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-i,1);
    const key=d.getFullYear()+'-'+d.getMonth();
    let v=DB.orders.filter(o=>!['canceled','concept'].includes(o.status))
      .filter(o=>{const s=D(o.startsAt);return s.getFullYear()+'-'+s.getMonth()===key})
      .reduce((s,o)=>s+orderTotals(o).total,0);
    /* historical baseline so the trend reads as a real year of trading */
    const seasonal=[0.62,0.58,0.71,0.83,0.96,1.14,1.28,1.22,1.06,0.94,0.79,0.88][d.getMonth()];
    if(i>0) v = 18400*seasonal + (Math.abs(hashCode(key))%2600);
    out.push({label:d.toLocaleDateString('en-US',{month:'short'}), year:d.getFullYear(), value:v, current:i===0});
  }
  return out;
}
function barChart(data, {h=190, fmt=money0}={}){
  const w=760, pl=52, pr=8, pt=14, pb=26;
  const max=Math.max(...data.map(d=>d.value))*1.12;
  const iw=w-pl-pr, ih=h-pt-pb, bw=iw/data.length;
  const ticks=[0,.25,.5,.75,1].map(t=>t*max);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Revenue by month">
    <g class="grid">${ticks.map(t=>{const y=pt+ih-(t/max)*ih;return `<line x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}"/>`}).join('')}</g>
    <g class="axis">${ticks.map(t=>{const y=pt+ih-(t/max)*ih;return `<text x="${pl-8}" y="${y+3.5}" text-anchor="end">${fmt(t)}</text>`}).join('')}</g>
    ${data.map((d,i)=>{
      const bh=Math.max(2,(d.value/max)*ih), x=pl+i*bw+bw*0.22, y=pt+ih-bh;
      return `<g><rect class="bar" x="${x}" y="${y}" width="${bw*0.56}" height="${bh}" rx="3"
        ${d.current?'opacity="1" stroke="var(--accent-700)" stroke-width="1.5"':'opacity="0.82"'}>
        <title>${d.label} ${d.year}: ${fmt(d.value)}</title></rect>
        <text class="axis" x="${pl+i*bw+bw/2}" y="${h-8}" text-anchor="middle" style="fill:var(--text-3);font-size:10.5px;font-family:var(--mono)">${d.label}</text>
        ${d.current?`<text x="${pl+i*bw+bw/2}" y="${y-5}" text-anchor="middle" style="fill:var(--accent-700);font-size:10.5px;font-weight:600;font-family:var(--mono)">${fmt(d.value)}</text>`:''}
      </g>`;
    }).join('')}
  </svg>`;
}
function productStats(){
  const map={};
  DB.orders.filter(o=>!['canceled','concept'].includes(o.status)).forEach(o=>{
    o.lines.forEach(l=>{
      if(!l.productId) return;
      const m=map[l.productId]||(map[l.productId]={qty:0,rev:0,orders:0,days:0});
      m.qty+=l.qty; m.rev+=lineTotal(l,o); m.orders++; m.days+=daysBetween(o.startsAt,o.stopsAt)*l.qty;
    });
  });
  return Object.entries(map).map(([pid,m])=>{
    const p=getProduct(pid);
    const capacity=p.stock*365;
    return {p, ...m, util: capacity? Math.min(100, (m.days/ (p.stock*90))*100) : 0};
  }).sort((a,b)=>b.rev-a.rev);
}

function viewSettings(){

    <div class="page-sub">Everything that shapes how orders price, print, email and behave</div></div></div>

      ${SET_GROUPS.map(g=>`<div class="eyebrow" style="padding:10px 10px 5px">${g.g}</div>
        ${g.items.map(i=>`<button class="nav-item" style="color:${S.settingsTab===i.id?'var(--accent-700)':'var(--text-2)'};background:${S.settingsTab===i.id?'var(--accent-tint)':'transparent'}" data-settab="${i.id}">${i.label}</button>`).join('')}`).join('')}

const POS_FILTERS=[{id:'today',label:'Today'},{id:'tomorrow',label:'Tomorrow'},{id:'upcoming',label:'Upcoming'},{id:'late',label:'Late'}];
const POS_LABELS=[{id:'all',label:'All orders'},{id:'pickup',label:'To pick up'},{id:'return',label:'To return'},{id:'short',label:'Shortage'}];
function posOrders(){
  const now=new Date();
  let list=DB.orders.filter(o=>HELD.includes(o.status));
  if(S.posFilter==='today')    list=list.filter(o=>sameDay(D(o.startsAt),now)||sameDay(D(o.stopsAt),now)||isLate(o));
  if(S.posFilter==='tomorrow') {const t=new Date(now);t.setDate(t.getDate()+1);list=list.filter(o=>sameDay(D(o.startsAt),t)||sameDay(D(o.stopsAt),t));}
  if(S.posFilter==='upcoming') list=list.filter(o=>D(o.startsAt)>now);
  if(S.posFilter==='late')     list=list.filter(isLate);
  if(S.posLabel==='pickup') list=list.filter(o=>o.status==='reserved');
  if(S.posLabel==='return') list=list.filter(o=>['started','mixed'].includes(o.status));
  if(S.posLabel==='short')  list=list.filter(o=>orderShortages(o).length);
  if(S.posQuery){const q=S.posQuery.toLowerCase();
    list=list.filter(o=>String(o.number).includes(q)||getCustomer(o.customerId).name.toLowerCase().includes(q)||o.lines.some(l=>l.title.toLowerCase().includes(q)));}
  return list.sort((a,b)=>D(a.status==='reserved'?a.startsAt:a.stopsAt)-D(b.status==='reserved'?b.startsAt:b.stopsAt));
}

function initSigpad(cv){
  if(!cv) return; const ctx=cv.getContext('2d'); let drawing=false;
  ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--text').trim()||'#000';
  ctx.lineWidth=2; ctx.lineCap='round'; ctx.lineJoin='round';
  const pt=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
    return [(t.clientX-r.left)*(cv.width/r.width),(t.clientY-r.top)*(cv.height/r.height)]};
  const start=e=>{drawing=true;ctx.beginPath();ctx.moveTo(...pt(e));e.preventDefault()};
  const move=e=>{if(!drawing)return;ctx.lineTo(...pt(e));ctx.stroke();e.preventDefault()};
  const end=()=>{drawing=false; cv.dataset.signed='1'};
  cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start); cv.addEventListener('touchmove',move); cv.addEventListener('touchend',end);
}

let WIRED=false;
function wireOnce(){
  if(WIRED) return; WIRED=true;
  const root=document;
  /* navigation */
  root.addEventListener('click', e=>{
    if(e.target.closest('[data-close-modal]')){ e.preventDefault(); return closeModal(); }
    const goEl=e.target.closest('[data-go]');
    const actEl=e.target.closest('[data-act]');
    if(actEl){ e.preventDefault(); e.stopPropagation(); handleAct(actEl); return; }
    if(goEl){ e.preventDefault(); go(goEl.dataset.go, goEl.dataset.param||null); return; }
    const t=e.target;
    const set=(k,v)=>{S[k]=v; render()};
    const d=t.closest('[data-range]');       if(d) return set('dashRange', d.dataset.range);
    const ot=t.closest('[data-otab]');       if(ot) return (S.selectedOrders.clear(), set('orderFilter', ot.dataset.otab));
    const otd=t.closest('[data-otabd]');     if(otd) return set('orderTab', otd.dataset.otabd);
    const dt=t.closest('[data-dtab]');       if(dt) return set('docFilter', dt.dataset.dtab);
    const ct=t.closest('[data-ctab]');       if(ct) return set('customerTab', ct.dataset.ctab);
    const pt=t.closest('[data-ptab]');       if(pt) return set('productFilter', pt.dataset.ptab);
    const ptd=t.closest('[data-ptabd]');     if(ptd) return set('productTab', ptd.dataset.ptabd);
    const rt=t.closest('[data-rtab]');       if(rt) return set('reportTab', rt.dataset.rtab);
    const st=t.closest('[data-settab]');     if(st) return set('settingsTab', st.dataset.settab);
    const sb=t.closest('[data-stab]');       if(sb) return set('storeTab', sb.dataset.stab);
    const bt=t.closest('[data-btab]');       if(bt) return set('blueprintTab', bt.dataset.btab);
    const pv=t.closest('[data-pview]');      if(pv) return set('productView', pv.dataset.pview);
    const cv=t.closest('[data-calview]');    if(cv) return set('calView', cv.dataset.calview);
    const dev=t.closest('[data-device]');    if(dev){ S.device=dev.dataset.device; S.posOrder=null; S.posScan=false; return render(); }
    const cal=t.closest('[data-cal]');       if(cal){
      const n=+cal.dataset.cal;
      S.calMonth = n===0 ? new Date(TODAY.getFullYear(),TODAY.getMonth(),1)
                         : new Date(S.calMonth.getFullYear(), S.calMonth.getMonth()+n, 1);
      return render(); }
    const pf=t.closest('[data-posfilter]');  if(pf) return set('posFilter', pf.dataset.posfilter);
    const pl=t.closest('[data-poslabel]');   if(pl) return set('posLabel', pl.dataset.poslabel);
    const pb=t.closest('[data-postab]');     if(pb){ S.posScan=(pb.dataset.postab==='scan'); S.posOrder=null; return set('posTab', pb.dataset.postab); }
    const po=t.closest('[data-posopen]');    if(po) return set('posOrder', po.dataset.posopen);
    const sh=t.closest('[data-scanhit]');    if(sh) return scanHit(sh.dataset.scanhit);
    const col=t.closest('[data-collection]');if(col){ const c=DB.collections.find(x=>x.id===col.dataset.collection);
      S.productQuery=''; toast(`Filtered to ${c.name}`); S.productFilter='all'; return render(); }
    /* toggles */
    const app=t.closest('[data-app]');       if(app){ const a=DB.apps.find(x=>x.id===app.dataset.app); a.on=!a.on;
      toast(`${a.name} ${a.on?'connected':'disconnected'}`); return render(); }
    const em=t.closest('[data-email]');      if(em){ const x=DB.emailTemplates.find(y=>y.id===em.dataset.email); x.on=!x.on;
      toast(`${x.name} ${x.on?'enabled':'disabled'}`); return render(); }
    const cp=t.closest('[data-coupon]');     if(cp){ const x=DB.coupons.find(y=>y.id===cp.dataset.coupon); x.active=!x.active;
      toast(`${x.code} ${x.active?'active':'paused'}`); return render(); }
    const pp=t.closest('[data-provider]');   if(pp){ const x=DB.paymentProviders.find(y=>y.id===pp.dataset.provider); x.on=!x.on;
      toast(`${x.name} ${x.on?'enabled':'disabled'}`); return render(); }
    const ptg=t.closest('[data-prod-toggle]');if(ptg && S.param){ const p=getProduct(S.param); p[ptg.dataset.prodToggle]=!p[ptg.dataset.prodToggle];
      return render(); }
    const sw=t.closest('.switch');           if(sw && !sw.dataset.app && !sw.dataset.email){ sw.classList.toggle('on');
      sw.setAttribute('aria-pressed', sw.classList.contains('on')); return; }
    const selall=t.closest('[data-selall]'); if(selall){ filteredOrders().forEach(o=> selall.checked?S.selectedOrders.add(o.id):S.selectedOrders.delete(o.id)); return render(); }
    const so=t.closest('[data-selorder]');   if(so){ so.checked?S.selectedOrders.add(so.dataset.selorder):S.selectedOrders.delete(so.dataset.selorder); return render(); }
  });

  /* inputs */
  root.addEventListener('input', e=>{
    const t=e.target;
    if(t.matches('[data-oquery]')){ S.orderQuery=t.value; const p=t.selectionStart; render(); const n=$('[data-oquery]'); if(n){n.focus();n.setSelectionRange(p,p)} return; }
    if(t.matches('[data-pquery]')){ S.productQuery=t.value; const p=t.selectionStart; render(); const n=$('[data-pquery]'); if(n){n.focus();n.setSelectionRange(p,p)} return; }
    if(t.matches('[data-cquery]')){ S.customerQuery=t.value; const p=t.selectionStart; render(); const n=$('[data-cquery]'); if(n){n.focus();n.setSelectionRange(p,p)} return; }
    if(t.matches('[data-posquery]')){ S.posQuery=t.value; const p=t.selectionStart; render(); const n=$('[data-posquery]'); if(n){n.focus();n.setSelectionRange(p,p)} return; }
    if(t.matches('[data-global-search]')){ S.globalQuery=t.value; return; }
    if(t.matches('[data-qty]')){ const o=getOrder(S.param); const l=o.lines.find(x=>x.id===t.dataset.qty);
      l.qty=Math.max(1,+t.value||1); const p=t.selectionStart; render(); const n=$(`[data-qty="${l.id}"]`); if(n){n.focus();try{n.setSelectionRange(p,p)}catch(_){}}; return; }
    if(t.matches('[data-period]')){ const o=getOrder(S.param); o[t.dataset.period]=new Date(t.value).toISOString();
      logActivity(o.id,`Rental period changed — re-priced and availability re-checked`); return render(); }
    if(t.matches('[data-field]')){ const o=getOrder(S.param); o.fields[t.dataset.field]=t.value; return; }
    if(t.matches('[data-cust]')){ const c=getCustomer(S.param); const k=t.dataset.cust;
      c[k]= k==='discount' ? (+t.value||0) : t.value; return; }
    if(t.matches('[data-custfield]')){ const c=getCustomer(S.param); c.fields[t.dataset.custfield]=t.value; return; }
    if(t.matches('[data-prod]')){ const p=getProduct(S.param); const k=t.dataset.prod;
      p[k]= ['price','deposit','stock','buffer','shortageLimit'].includes(k) ? (+t.value||0)
          : k==='tags' ? t.value.split(',').map(s=>s.trim()).filter(Boolean) : t.value; return; }
    if(t.matches('[data-co]')){ DB.company[t.dataset.co]=t.value; return; }
    if(t.matches('[data-label]')){ DB.labels[t.dataset.label]=t.value; return; }
  });
  root.addEventListener('change', e=>{
    const t=e.target;
    if(t.matches('[data-prod]')||t.matches('[data-cust]')||t.matches('[data-co]')) return;
    if(t.matches('[data-act="location"]')) toast('Switched location — lists now filter to '+t.selectedOptions[0].text);
  });
  root.addEventListener('keydown', e=>{
    if(e.target.matches('[data-global-search]') && e.key==='Enter'){ globalSearch(e.target.value); }
  });
}

function globalSearch(q){
  q=q.trim(); if(!q) return;
  const si=DB.stockItems.find(x=>x.barcode.toLowerCase()===q.toLowerCase()||x.identifier.toLowerCase()===q.toLowerCase());
  if(si){ return go('products', si.productId); }
  const byNum=orderByNumber(q.replace('#',''));
  if(byNum) return go('orders', byNum.id);
  const c=DB.customers.find(x=>x.name.toLowerCase().includes(q.toLowerCase()));
  if(c) return go('customers', c.id);
  const p=DB.products.find(x=>x.name.toLowerCase().includes(q.toLowerCase())||x.sku.toLowerCase()===q.toLowerCase());
  if(p) return go('products', p.id);
  S.orderQuery=q; go('orders');
}
function scanHit(stockId){
  const si=DB.stockItems.find(x=>x.id===stockId);
  S.posScan=false; S.posTab='dashboard';
  const onOrder=DB.orders.find(o=>HELD.includes(o.status)&&o.lines.some(l=>l.productId===si.productId));
  if(onOrder){ S.posOrder=onOrder.id; toast(`${si.identifier} → order #${onOrder.number}`); }
  else toast(`${si.identifier} · ${getProduct(si.productId).name} — in stock, not on an order`);
  render();
}

/* ============================================================
   18. ACTION HANDLER
   ============================================================ */
function handleAct(el){
  const a=el.dataset.act;
  const o = el.dataset.order ? getOrder(el.dataset.order) : (S.route==='orders'&&S.param ? getOrder(S.param) : null);
  switch(a){
    case 'menu': S.sidebarOpen=!S.sidebarOpen; return render();
    case 'theme': {
      const cur=document.documentElement.getAttribute('data-theme');
      const next = cur==='dark' ? 'light' : cur==='light' ? null : 'dark';
      if(next) document.documentElement.setAttribute('data-theme',next); else document.documentElement.removeAttribute('data-theme');
      toast(next?`${next[0].toUpperCase()+next.slice(1)} theme`:'Following your system theme'); return; }
    case 'new-order': return openNewOrder(el.dataset.customer, el.dataset.product);
    case 'create-order': {
      const cid=$('#no-cust').value;
      if(!cid){ toast('Pick a customer first','bad'); return; }
      ORDER_SEQ++;
      const ord={id:uid('o'), number:ORDER_SEQ, status:el.dataset.mode, customerId:cid,
        source:$('#no-src').value, locationId:$('#no-loc').value,
        startsAt:new Date($('#no-start').value).toISOString(), stopsAt:new Date($('#no-stop').value).toISOString(),
        createdAt:new Date().toISOString(), deposit:0, couponId:null, lines:[], fields:{}, tags:[],
        notes:[], activity:[], payments:[], signature:null, signedAt:null};
      if(el.dataset.product){ const p=getProduct(el.dataset.product); ord.lines.push(L(p.id,1)); ord.deposit=p.deposit; }
      DB.orders.unshift(ord);
      logActivity(ord.id,'Order created from the back office');
      if(el.dataset.mode==='reserved') logActivity(ord.id,'Status changed to Reserved',true);
      closeModal(); toast(`Order #${ord.number} created`); return go('orders', ord.id); }
    case 'reserve': return reserveOrder(o);
    case 'pickup': return openPickup(o);
    case 'return': return openReturn(o);
    case 'confirm-pickup': {
      const root=$('#modal-root');
      let n=0;
      o.lines.forEach(l=>{
        const cb=root.querySelector(`[data-pick="${l.id}"]`); if(!cb||!cb.checked) return;
        const q=Math.min(l.qty-l.pickedQty, +root.querySelector(`[data-pickqty="${l.id}"]`).value||0);
        if(q<=0) return;
        l.pickedQty+=q; n+=q;
        root.querySelectorAll(`[data-pickitem="${l.id}"]:checked`).forEach(x=>{ if(!l.stockItemIds.includes(x.value)) l.stockItemIds.push(x.value); });
      });
      const sig=root.querySelector('#sigpad');
      if(sig&&sig.dataset.signed){ o.signature=getCustomer(o.customerId).contact; o.signedAt=new Date().toISOString();
        const cd=DB.documents.find(d=>d.orderId===o.id&&d.type==='contract');
        if(cd){ cd.signedBy=o.signature; cd.status='Signed'; } }
      if(!n){ toast('Nothing was ticked','bad'); return; }
      o.status=recomputeStatus(o);
      logActivity(o.id, `${n} item${n>1?'s':''} picked up — status changed to ${STATUS[o.status].label}`, true);
      closeModal(); toast(`${n} item${n>1?'s':''} handed over`); return render(); }
    case 'confirm-return': {
      const root=$('#modal-root'); let n=0;
      o.lines.forEach(l=>{
        const cb=root.querySelector(`[data-ret="${l.id}"]`); if(!cb||!cb.checked) return;
        const q=Math.min(l.pickedQty-l.returnedQty, +root.querySelector(`[data-retqty="${l.id}"]`).value||0);
        if(q<=0) return; l.returnedQty+=q; n+=q;
      });
      if(!n){ toast('Nothing was ticked','bad'); return; }
      const dmg=+($('#ret-damage')?.value||0), nte=$('#ret-note')?.value||'';
      o.status=recomputeStatus(o);
      const hold=o.payments.find(p=>p.kind==='Security deposit hold'&&p.status==='Authorized');
      if(hold){ if(dmg>0){ hold.status='Paid'; hold.amount=dmg; hold.kind='Deposit captured (damage)'; }
                else hold.status='Released'; }
      if(nte) DB.notes.push(o.notes[o.notes.length]= note('order',o.id,'Return note: '+nte, ME().name, new Date().toISOString()));
      logActivity(o.id, `${n} item${n>1?'s':''} returned — status changed to ${STATUS[o.status].label}`, true);
      if(dmg>0) logActivity(o.id, `${money(dmg)} withheld from the security deposit`);
      else if(hold) logActivity(o.id, `Security deposit released`);
      closeModal(); toast(`${n} item${n>1?'s':''} back in stock`); return render(); }
    case 'archive': o.status='archived'; logActivity(o.id,'Order archived',true); toast(`Order #${o.number} archived`); return render();
    case 'unarchive': o.status=recomputeStatus({...o,status:'reserved'}); logActivity(o.id,'Order reopened',true); toast('Reopened'); return render();
    case 'cancel': {
      if(!confirm(`Cancel order #${o.number}? Stock is released immediately.`)) return;
      o.status='canceled'; logActivity(o.id,'Order canceled',true); toast(`Order #${o.number} canceled`); return render(); }
    case 'revert': {
      const back={reserved:'concept', started:'reserved', mixed:'reserved', stopped:'started', archived:'stopped'}[o.status];
      if(!back) return;
      if(back==='reserved'){ o.lines.forEach(l=>{l.pickedQty=0;l.returnedQty=0;l.stockItemIds=[]}); }
      if(back==='started'){ o.lines.forEach(l=>l.returnedQty=0); }
      o.status=back; logActivity(o.id,`Status reverted to ${STATUS[back].label}`,true); toast(`Back to ${STATUS[back].label}`); return render(); }
    case 'duplicate': {
      ORDER_SEQ++;
      const copy=JSON.parse(JSON.stringify(o));
      copy.id=uid('o'); copy.number=ORDER_SEQ; copy.status='concept'; copy.createdAt=new Date().toISOString();
      copy.lines.forEach(l=>{l.id=uid('ln');l.pickedQty=0;l.returnedQty=0;l.stockItemIds=[]});
      copy.payments=[]; copy.notes=[]; copy.activity=[]; copy.signature=null; copy.signedAt=null;
      DB.orders.unshift(copy); logActivity(copy.id,`Duplicated from order #${o.number}`);
      toast(`Created #${copy.number} as a concept`); return go('orders', copy.id); }
    case 'add-product': return openAddProduct(o);
    case 'pick-product': {
      const p=getProduct(el.dataset.product);
      const ex=o.lines.find(l=>l.productId===p.id);
      if(ex) ex.qty++; else o.lines.push(L(p.id,1));
      if(p.deposit && !o.deposit) o.deposit=p.deposit;
      const list=$('#ap-list'); if(list) list.innerHTML=addProductList(o, $('#ap-q')?.value||'');
      toast(`${p.name} added`); render(); return; }
    case 'add-custom': {
      const title=prompt('What is the line called?','Cleaning fee'); if(!title) return;
      const price=+prompt('Price for this line', '50')||0;
      o.lines.push(CL(title,1,price)); logActivity(o.id,`Custom line "${title}" added`);
      toast('Custom line added'); return render(); }
    case 'rm-line': o.lines=o.lines.filter(l=>l.id!==el.dataset.line); toast('Line removed'); return render();
    case 'apply-coupon': {
      const code=prompt('Coupon code — try WEEKEND15 or FILMSCHOOL','WEEKEND15'); if(!code) return;
      const cp=DB.coupons.find(c=>c.code.toLowerCase()===code.trim().toLowerCase()&&c.active);
      if(!cp){ toast('No active coupon with that code','bad'); return; }
      o.couponId=cp.id; cp.uses++; logActivity(o.id,`Coupon ${cp.code} applied`);
      toast(`${cp.code} applied`); return render(); }
    case 'rm-coupon': o.couponId=null; toast('Coupon removed'); return render();
    case 'set-deposit': { const v=prompt('Security deposit amount', o.deposit||0); if(v===null) return;
      o.deposit=+v||0; toast('Deposit updated'); return render(); }
    case 'new-payment': {
      const t=orderTotals(o);
      openModal({title:'Register a payment', sub:`#${o.number} · ${money(Math.max(0,t.due))} outstanding`, size:'narrow',
        body:`<div class="field"><label>Amount</label><input type="number" id="pay-amt" value="${Math.max(0,t.due).toFixed(2)}"></div>
          <div class="field" style="margin-top:12px"><label>Method</label><select id="pay-method">
            <option>Credit card</option><option>Cash</option><option>Bank transfer</option><option>Check</option><option>Tap to Pay</option></select></div>
          <div class="field" style="margin-top:12px"><label>Kind</label><select id="pay-kind">
            <option>Full payment</option><option>Down payment</option><option>Partial payment</option><option>Security deposit hold</option></select></div>`,
        foot:`<button class="btn" data-close-modal>Cancel</button><button class="btn primary" data-act="confirm-payment" data-order="${o.id}">Register</button>`});
      return; }
    case 'confirm-payment': {
      const amt=+$('#pay-amt').value||0, m=$('#pay-method').value, k=$('#pay-kind').value;
      if(amt<=0){ toast('Enter an amount','bad'); return; }
      const p=pay(o.id, amt, m, k, new Date().toISOString(), k==='Security deposit hold'?'Authorized':'Paid');
      DB.payments.push(p); o.payments.push(p);
      logActivity(o.id, `${k} of ${money(amt)} registered (${m})`);
      const inv=DB.documents.find(d=>d.orderId===o.id&&d.type==='invoice');
      if(inv){ const t2=orderTotals(o); inv.status = t2.due<=0.01?'Paid':t2.paid>0?'Partially paid':inv.status; }
      closeModal(); toast(`${money(amt)} registered`); return render(); }
    case 'request-payment': { logActivity(o.id,'Payment link emailed to the customer');
      toast(`Payment link sent to ${getCustomer(o.customerId).email}`); return render(); }
    case 'hold-deposit': {
      const p=pay(o.id, o.deposit, 'Credit card', 'Security deposit hold', new Date().toISOString(), 'Authorized');
      DB.payments.push(p); o.payments.push(p); logActivity(o.id,`Security deposit of ${money(o.deposit)} authorised`);
      toast('Deposit held'); return render(); }
    case 'capture': { const p=o.payments.find(x=>x.id===el.dataset.pay);
      const keep=+prompt(`Capture how much of the ${money(p.amount)} hold? 0 releases it in full.`,'0')||0;
      if(keep>0){ p.status='Paid'; p.amount=keep; p.kind='Deposit captured'; logActivity(o.id,`${money(keep)} captured from the deposit`); }
      else { p.status='Released'; logActivity(o.id,'Security deposit released'); }
      toast(keep>0?`${money(keep)} captured`:'Deposit released'); return render(); }
    case 'gen-doc': {
      const type=el.dataset.type, key=type==='Packing slip'?'packing':type.toLowerCase();
      const d=doc(o.id, key, key==='invoice'?'Sent':key==='packing'?'Printed':'Draft', new Date().toISOString());
      DB.documents.unshift(d); logActivity(o.id, `${type} ${d.number} generated`);
      toast(`${type} ${d.number} generated`); S.orderTab='documents'; return render(); }
    case 'view-doc': return openDoc(DB.documents.find(d=>d.id===el.dataset.doc));
    case 'send-doc': { const d=DB.documents.find(x=>x.id===el.dataset.doc); const oo=getOrder(d.orderId);
      d.sentTo=getCustomer(oo.customerId).email; if(d.status==='Draft') d.status='Sent';
      logActivity(oo.id, `${d.number} sent to ${d.sentTo}`); closeModal();
      toast(`${d.number} sent to ${d.sentTo}`); return render(); }
    case 'sign-doc': { const d=DB.documents.find(x=>x.id===el.dataset.doc); const oo=getOrder(d.orderId);
      d.signedBy=getCustomer(oo.customerId).contact; d.status='Signed';
      oo.signature=d.signedBy; oo.signedAt=new Date().toISOString();
      logActivity(oo.id, `${d.number} signed by ${d.signedBy}`); toast('Signature captured'); return render(); }
    case 'sign': { o.signature=getCustomer(o.customerId).contact; o.signedAt=new Date().toISOString();
      logActivity(o.id, `Signature collected from ${o.signature}`); toast('Signature captured'); return render(); }
    case 'add-order-note': { const b=prompt('Note for the team'); if(!b) return;
      const n=note('order',o.id,b,ME().name,new Date().toISOString()); DB.notes.push(n); o.notes.push(n);
      toast('Note added'); return render(); }
    case 'add-day-note': { const b=prompt('Note for the day'); if(!b) return;
      DB.notes.push(note('day','dash',b,ME().name,new Date().toISOString())); toast('Note added'); return render(); }
    case 'add-cust-note': { const b=prompt('Note on this customer'); if(!b) return;
      DB.notes.push(note('customer',el.dataset.customer,b,ME().name,new Date().toISOString())); toast('Note added'); return render(); }
    case 'add-prod-note': { const b=prompt('Note on this product'); if(!b) return;
      DB.notes.push(note('product',el.dataset.product,b,ME().name,new Date().toISOString())); toast('Note added'); return render(); }
    case 'save-customer': toast('Customer saved'); return render();
    case 'save-product': toast('Product saved'); return render();
    case 'save-company': toast('Company information saved'); return render();
    case 'save-labels': toast('Labels saved — the whole account now uses them'); return render();
    case 'new-customer': {
      const name=prompt('Customer name'); if(!name) return;
      const c={id:uid('c'), number:'CUST-'+(1046+DB.customers.length), kind:'Company', name, contact:name,
        email:name.toLowerCase().replace(/\s+/g,'.')+'@example.com', phone:'', address:'', city:'', zip:'',
        country:DB.company.country, tags:[], discount:0, taxProfile:'tp_std', since:new Date().toISOString().slice(0,10), fields:{}};
      DB.customers.unshift(c); toast(`${name} added`); return go('customers', c.id); }
    case 'new-product': {
      const name=prompt('Product name'); if(!name) return;
      const p={id:uid('p'), sku:'NEW-'+String(DB.products.length+1).padStart(3,'0'), name, type:'rental', track:'bulk',
        icon:'📦', collection:null, price:50, period:'day', priceType:'flat', structure:null, deposit:0, stock:1,
        buffer:0, allowShortage:false, shortageLimit:0, tags:[], location:'loc_pdx', desc:'', online:true,
        taxProfile:'tp_std', variations:[]};
      DB.products.unshift(p); toast(`${name} added`); return go('products', p.id); }
    case 'add-stock': { const p=getProduct(el.dataset.product);
      const n=DB.stockItems.filter(s=>s.productId===p.id).length+1;
      DB.stockItems.push({id:uid('si'), productId:p.id, identifier:p.sku+'-'+pad(n,3),
        barcode:'BQ'+String(Math.abs(hashCode(p.sku+n))).slice(0,9), status:'in-stock', condition:'good', location:p.location, note:''});
      p.stock++; toast('Stock item added'); return render(); }
    case 'toggle-condition': { const si=DB.stockItems.find(x=>x.id===el.dataset.stock);
      si.condition = si.condition==='maintenance'?'good':'maintenance';
      if(si.condition==='good') si.note='';
      toast(si.condition==='maintenance'?'Sent to the bench — it is out of availability now':'Back in service'); return render(); }
    case 'add-downtime': { const p=getProduct(el.dataset.product);
      const reason=prompt('Why is it unavailable?','Maintenance'); if(!reason) return;
      const days=+prompt('For how many days from today?','3')||1;
      DB.downtime.push({id:uid('dt'), productId:p.id, qty:1, from:at(0,0), to:at(days,0), reason});
      toast(`${days} day(s) of downtime scheduled`); return render(); }
    case 'rm-downtime': DB.downtime=DB.downtime.filter(d=>d.id!==el.dataset.dt); toast('Downtime removed'); return render();
    case 'print-barcodes': { const p=getProduct(el.dataset.product);
      const items=DB.stockItems.filter(s=>s.productId===p.id);
      openModal({title:'Print labels', sub:`${p.name} · ${items.length} items`, size:'wide',
        body:`<div class="pgrid">${items.map(si=>`<div class="card" style="padding:12px;text-align:center">
          <div style="font-weight:600;font-size:12px">${esc(p.name)}</div>
          <div class="mono" style="font-size:11px;color:var(--text-3)">${esc(p.sku)}</div>
          <div style="display:flex;justify-content:center;margin:9px 0">${barcodeSvg(si.barcode)}</div>
          <div class="mono" style="font-size:11px;font-weight:600">${esc(si.identifier)}</div>
          <div class="mono" style="font-size:10px;color:var(--text-3)">${esc(si.barcode)}</div></div>`).join('')}</div>`,
        foot:`<button class="btn" data-close-modal>Close</button><button class="btn primary" data-act="print-report">Print sheet</button>`});
      return; }
    case 'print-report': window.print(); return;
    case 'run-report': S.reportTab='fulfillment'; return go('reports');
    case 'export': toast(`${el.dataset.what||'Data'} exported as CSV`); return;
    case 'import': toast('Import wizard — map your CSV columns to Booqable fields'); return;
    case 'email-customer': toast('Composer opened with your manual email templates'); return;
    case 'new-coupon': { const code=prompt('Coupon code','SUMMER10'); if(!code) return;
      DB.coupons.push({id:uid('cpn'), code:code.toUpperCase(), kind:'Percentage', value:10, uses:0, limit:0, active:true, note:'Created just now'});
      toast(`${code.toUpperCase()} created`); return render(); }
    case 'bulk-archive': { S.selectedOrders.forEach(id=>{const x=getOrder(id); if(x.status==='stopped'||x.status==='canceled'){x.status='archived'; logActivity(id,'Archived in bulk');}});
      toast(`${S.selectedOrders.size} order(s) processed — only returned or canceled orders can be archived`); S.selectedOrders.clear(); return render(); }
    case 'bulk-tag': { const t=prompt('Tag to add','priority'); if(!t) return;
      S.selectedOrders.forEach(id=>{const x=getOrder(id); if(!x.tags.includes(t)) x.tags.push(t)});
      toast(`Tagged ${S.selectedOrders.size} order(s)`); S.selectedOrders.clear(); return render(); }
    case 'bulk-clear': S.selectedOrders.clear(); return render();
    case 'clear-sig': { const c=$('#sigpad'); if(c){ c.getContext('2d').clearRect(0,0,c.width,c.height); delete c.dataset.signed; } return; }
    case 'doc-menu': S.orderTab='documents'; return render();
    /* POS */
    case 'pos-scan': S.posScan=true; return render();
    case 'pos-scan-close': S.posScan=false; S.posTab='dashboard'; return render();
    case 'pos-back': S.posOrder=null; return render();
    case 'pos-pickup': { o.lines.forEach(l=>l.pickedQty=l.qty); o.status=recomputeStatus(o);
      o.signature=o.signature||getCustomer(o.customerId).contact; o.signedAt=o.signedAt||new Date().toISOString();
      logActivity(o.id,`All items picked up on the mobile POS`,true); toast(`#${o.number} picked up`); return render(); }
    case 'pos-return': { o.lines.forEach(l=>l.returnedQty=l.pickedQty=l.qty); o.status=recomputeStatus(o);
      const hold=o.payments.find(p=>p.kind==='Security deposit hold'&&p.status==='Authorized'); if(hold) hold.status='Released';
      logActivity(o.id,`All items returned on the mobile POS`,true); toast(`#${o.number} returned`); return render(); }
    case 'pos-pay': { const t=orderTotals(o);
      if(t.due<=0.01){ toast('Already settled'); return; }
      const p=pay(o.id,t.due,'Tap to Pay','Full payment',new Date().toISOString());
      DB.payments.push(p); o.payments.push(p); logActivity(o.id,`${money(t.due)} taken on the mobile POS (Tap to Pay)`);
      toast(`${money(t.due)} taken`); return render(); }
    case 'pos-cancel': { if(!confirm(`Cancel #${o.number}?`)) return; o.status='canceled';
      logActivity(o.id,'Canceled on the mobile POS',true); toast('Canceled'); return render(); }
    case 'location': return;
    default: toast('Not wired in this prototype: '+a); return;
  }
}

/* ============================================================
   19. BOOT
   ============================================================ */
(function boot(){
  const [r,p]=location.hash.replace(/^#\//,'').split('/');
  if(r) { S.route=r; S.param=p||null; }
  wireOnce();
  render();
})();
</script>
